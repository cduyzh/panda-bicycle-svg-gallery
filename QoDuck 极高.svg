      <path d="M 0 -104 Q 22 -116 34 -104 Q 20 -98 0 -104 Z" fill="#7fc283"/>
      <path d="M 0 -72 Q -24 -84 -36 -72 Q -20 -66 0 -72 Z" fill="#7fc283"/>
      <path d="M 0 -40 Q 20 -50 30 -40 Q 18 -34 0 -40 Z" fill="#8fd193"/>
    </g>
    <path id="hillFar" d="M 0 436 L 0 360 Q 100 300 200 356 Q 300 306 400 360 Q 500 310 600 356 Q 700 316 800 360 L 800 436 Z"/>
    <path id="hillNear" d="M 0 436 L 0 392 Q 130 340 260 388 Q 390 344 520 392 Q 660 348 800 392 L 800 436 Z"/>
    <g id="spokes" stroke="#c9ced6" stroke-width="2.5">
      <path d="M 0 -43 V 43 M -43 0 H 43 M -30.4 -30.4 L 30.4 30.4 M -30.4 30.4 L 30.4 -30.4"/>
    </g>
    <g id="wheel">
