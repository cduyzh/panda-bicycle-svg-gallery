<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <g id="wheel">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#333" stroke-width="5"/>
      <circle cx="0" cy="0" r="55" fill="none" stroke="#666" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="#555"/>
      <line x1="0" y1="-55" x2="0" y2="55" stroke="#888" stroke-width="1.2"/>
      <line x1="-55" y1="0" x2="55" y2="0" stroke="#888" stroke-width="1.2"/>
      <line x1="-39" y1="-39" x2="39" y2="39" stroke="#888" stroke-width="1.2"/>
      <line x1="39" y1="-39" x2="-39" y2="39" stroke="#888" stroke-width="1.2"/>
    </g>
    <g id="pedal">
      <circle cx="0" cy="0" r="5" fill="#555"/>
      <line x1="0" y1="0" x2="0" y2="22" stroke="#555" stroke-width="3" stroke-linecap="round"/>
      <rect x="-7" y="20" width="14" height="6" rx="3" fill="#444"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="#87CEEB"/>

  <!-- Sun -->
  <circle cx="650" cy="80" r="50" fill="#FFD700" opacity="0.95">
    <animate attributeName="r" values="50;55;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#FFD700" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <line x1="650" y1="15" x2="650" y2="5"><animate attributeName="y2" values="5;1;5" dur="2s" repeatCount="indefinite"/></line>
    <line x1="650" y1="145" x2="650" y2="155"><animate attributeName="y2" values="155;159;155" dur="2s" repeatCount="indefinite"/></line>
    <line x1="585" y1="80" x2="575" y2="80"><animate attributeName="x2" values="575;571;575" dur="2s" repeatCount="indefinite"/></line>
    <line x1="715" y1="80" x2="725" y2="80"><animate attributeName="x2" values="725;729;725" dur="2s" repeatCount="indefinite"/></line>
  </g>

  <!-- Ground -->
  <rect x="0" y="370" width="800" height="130" fill="#4CAF50"/>
  <rect x="0" y="370" width="800" height="5" fill="#388E3C"/>

  <!-- Road -->
  <rect x="0" y="355" width="800" height="20" fill="#888"/>
  <rect x="0" y="364" width="800" height="3" fill="#FFEB3B" stroke-dasharray="35 25">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- === SCROLLING GROUP: bike + panda === -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-250,0;950,0" dur="9s" repeatCount="indefinite"/>

    <!-- Rear wheel -->
    <g transform="translate(280, 340)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- Front wheel -->
    <g transform="translate(480, 340)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- Bike frame -->
    <g stroke="#E53935" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="280,340 350,290 350,250 450,250 480,340"/>
      <line x1="350" y1="250" x2="450" y2="250"/>
      <line x1="280" y1="340" x2="350" y2="290"/>
      <line x1="450" y1="250" x2="480" y2="340"/>
      <line x1="440" y1="250" x2="455" y2="235"/>
    </g>

    <!-- Bottom bracket -->
    <circle cx="350" cy="290" r="8" fill="#555"/>

    <!-- Chain ring -->
    <circle cx="350" cy="290" r="20" fill="none" stroke="#555" stroke-width="3"/>

    <!-- Chain (simplified) -->
    <path d="M350,270 L280,320" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4 2"/>
    <path d="M350,310 L280,360" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4 2"/>

    <!-- Handlebars -->
    <line x1="455" y1="235" x2="468" y2="220" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <line x1="448" y1="238" x2="440" y2="222" stroke="#555" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Seat post + seat -->
    <line x1="350" y1="250" x2="350" y2="235" stroke="#555" stroke-width="4"/>
    <ellipse cx="350" cy="232" rx="16" ry="6" fill="#333"/>

    <!-- Pedals (rotating around bottom bracket) -->
    <g transform="translate(350, 290)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <use href="#pedal"/>
        <use href="#pedal" transform="rotate(180)"/>
      </g>
    </g>

    <!-- === PANDA === -->
    <g transform="translate(350, 232)">

      <!-- Left leg (pedaling) -->
      <g transform="translate(-12, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-30,0,55;-25,0,55;10,0,55;25,0,55;-30,0,55" dur="0.8s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="45" rx="11" ry="16" fill="#1a1a1a"/>
          <ellipse cx="0" cy="65" rx="8" ry="15" fill="#1a1a1a"/>
          <ellipse cx="0" cy="80" rx="10" ry="5" fill="#1a1a1a"/>
        </g>
      </g>

      <!-- Right leg (pedaling opposite phase) -->
      <g transform="translate(12, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="25,0,55;10,0,55;-25,0,55;-30,0,55;25,0,55" dur="0.8s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="45" rx="11" ry="16" fill="#1a1a1a"/>
          <ellipse cx="0" cy="65" rx="8" ry="15" fill="#1a1a1a"/>
          <ellipse cx="0" cy="80" rx="10" ry="5" fill="#1a1a1a"/>
        </g>
      </g>

      <!-- Body -->
      <ellipse cx="0" cy="15" rx="32" ry="36" fill="white" stroke="#333" stroke-width="1.5"/>
      <ellipse cx="0" cy="20" rx="20" ry="22" fill="#F5F5F5"/>

      <!-- Left arm -->
      <g transform="translate(-24, -2)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-10,0,0;-5,0,0;5,0,0;10,0,0;-10,0,0" dur="0.8s" repeatCount="indefinite"/>
          <ellipse cx="-8" cy="15" rx="10" ry="18" fill="#1a1a1a" transform="rotate(25,-8,15)"/>
          <circle cx="-18" cy="28" r="7" fill="#1a1a1a"/>
        </g>
      </g>

      <!-- Right arm -->
      <g transform="translate(24, -2)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="10,0,0;5,0,0;-5,0,0;-10,0,0;10,0,0" dur="0.8s" repeatCount="indefinite"/>
          <ellipse cx="8" cy="15" rx="10" ry="18" fill="#1a1a1a" transform="rotate(-25,8,15)"/>
          <circle cx="18" cy="28" r="7" fill="#1a1a1a"/>
        </g>
      </g>

      <!-- Head -->
      <circle cx="0" cy="-30" r="29" fill="white" stroke="#333" stroke-width="1.5"/>

      <!-- Ears -->
      <circle cx="-24" cy="-50" r="13" fill="#1a1a1a"/>
      <circle cx="24" cy="-50" r="13" fill="#1a1a1a"/>

      <!-- Eye patches -->
      <ellipse cx="-13" cy="-32" rx="11" ry="13" fill="#1a1a1a" transform="rotate(-10,-13,-32)"/>
      <ellipse cx="13" cy="-32" rx="11" ry="13" fill="#1a1a1a" transform="rotate(10,13,-32)"/>

      <!-- Eyes -->
      <circle cx="-11" cy="-31" r="4.5" fill="white">
        <animate attributeName="cy" values="-31;-29;-31" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="-31" r="4.5" fill="white">
        <animate attributeName="cy" values="-31;-29;-31" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Pupils -->
      <circle cx="-10" cy="-31" r="2.2" fill="#111">
        <animate attributeName="cy" values="-31;-29;-31" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="-31" r="2.2" fill="#111">
        <animate attributeName="cy" values="-31;-29;-31" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Nose -->
      <ellipse cx="0" cy="-21" rx="5.5" ry="4" fill="#333"/>

      <!-- Mouth -->
      <path d="M-7,-16 Q0,-11 7,-16" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Blush -->
      <circle cx="-20" cy="-20" r="6" fill="#FFAB91" opacity="0.45"/>
      <circle cx="20" cy="-20" r="6" fill="#FFAB91" opacity="0.45"/>

      <!-- Bamboo snack -->
      <line x1="18" y1="-24" x2="50" y2="-42" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="18" y1="-24" x2="50" y2="-42" stroke="#81C784" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="33" y1="-32" x2="33" y2="-38" stroke="#81C784" stroke-width="1"/>
      <line x1="41" y1="-37" x2="41" y2="-43" stroke="#81C784" stroke-width="1"/>
    </g>
  </g>

  <!-- === FOREGROUND ELEMENTS === -->

  <!-- Clouds -->
  <g opacity="0.85">
    <ellipse cx="120" cy="55" rx="45" ry="22" fill="white"/>
    <ellipse cx="155" cy="43" rx="35" ry="20" fill="white"/>
    <ellipse cx="90" cy="50" rx="28" ry="16" fill="white"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;40,0;0,0" dur="18s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.75">
    <ellipse cx="560" cy="40" rx="38" ry="18" fill="white"/>
    <ellipse cx="592" cy="32" rx="30" ry="16" fill="white"/>
    <ellipse cx="535" cy="36" rx="24" ry="13" fill="white"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-30,0;0,0" dur="22s" repeatCount="indefinite"/>
  </g>

  <!-- Flowers -->
  <g>
    <circle cx="80" cy="385" r="5" fill="#FF80AB"/><circle cx="80" cy="385" r="2" fill="#FFD54F"/>
    <circle cx="180" cy="392" r="5" fill="#CE93D8"/><circle cx="180" cy="392" r="2" fill="#FFD54F"/>
    <circle cx="320" cy="388" r="5" fill="#FF80AB"/><circle cx="320" cy="388" r="2" fill="#FFD54F"/>
    <circle cx="460" cy="393" r="5" fill="#81D4FA"/><circle cx="460" cy="393" r="2" fill="#FFD54F"/>
    <circle cx="600" cy="386" r="5" fill="#FF80AB"/><circle cx="600" cy="386" r="2" fill="#FFD54F"/>
    <circle cx="720" cy="390" r="5" fill="#CE93D8"/><circle cx="720" cy="390" r="2" fill="#FFD54F"/>
  </g>
</svg>