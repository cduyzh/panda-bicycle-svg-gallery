<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>熊猫骑自行车 GLM-5.3-Flash</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee3ff"/>
      <stop offset="70%" stop-color="#e6f7ff"/>
      <stop offset="100%" stop-color="#fff8e6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6570"/>
      <stop offset="100%" stop-color="#3d454d"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(700,80)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <g stroke="#ffd75e" stroke-width="4" stroke-linecap="round" opacity="0.8">
        <line x1="0" y1="-52" x2="0" y2="-64"/>
        <line x1="0" y1="52" x2="0" y2="64"/>
        <line x1="-52" y1="0" x2="-64" y2="0"/>
        <line x1="52" y1="0" x2="64" y2="0"/>
        <line x1="37" y1="-37" x2="45" y2="-45"/>
        <line x1="-37" y1="37" x2="-45" y2="45"/>
        <line x1="37" y1="37" x2="45" y2="45"/>
        <line x1="-37" y1="-37" x2="-45" y2="-45"/>
      </g>
    </g>
    <circle r="40" fill="#ffd75e"/>
    <circle r="32" fill="#ffe38a"/>
  </g>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="900 0; -260 0" dur="16s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="110" rx="55" ry="20"/>
      <ellipse cx="-35" cy="100" rx="35" ry="16"/>
      <ellipse cx="38" cy="102" rx="30" ry="14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1000 0; -300 0" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="60" rx="42" ry="15"/>
      <ellipse cx="-28" cy="52" rx="26" ry="12"/>
      <ellipse cx="30" cy="53" rx="24" ry="11"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M0,455 L120,360 L240,455 Z" fill="#b8d8b0" opacity="0.7"/>
  <path d="M170,455 L320,340 L470,455 Z" fill="#a3cb9a" opacity="0.6"/>
  <path d="M520,455 L660,370 L800,455 Z" fill="#b8d8b0" opacity="0.7"/>

  <!-- 草地 -->
  <rect x="0" y="448" width="800" height="10" fill="#7cc06a"/>

  <!-- 道路 -->
  <rect x="0" y="455" width="800" height="45" fill="url(#road)"/>
  <line x1="0" y1="478" x2="800" y2="478" stroke="#f4f4f4" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="60" y1="300" x2="150" y2="300" stroke-dasharray="26 20">
      <animate attributeName="stroke-dashoffset" from="0" to="-92" dur="0.45s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="345" x2="200" y2="345" stroke-dasharray="30 24">
      <animate attributeName="stroke-dashoffset" from="0" to="-108" dur="0.38s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="395" x2="140" y2="395" stroke-dasharray="22 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="462" rx="190" ry="10" fill="#000000" opacity="0.25"/>

  <!-- ====== 整车 ====== -->
  <g>
    <!-- 轻微颠簸 -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g>
      <circle cx="280" cy="380" r="70" fill="none" stroke="#222" stroke-width="10"/>
      <circle cx="280" cy="380" r="60" fill="none" stroke="#9aa3ab" stroke-width="3"/>
      <g stroke="#c8cdd2" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 280 380" to="360 280 380" dur="0.9s" repeatCount="indefinite"/>
        <line x1="280" y1="315" x2="280" y2="445"/>
        <line x1="215" y1="380" x2="345" y2="380"/>
        <line x1="234" y1="334" x2="326" y2="426"/>
        <line x1="326" y1="334" x2="234" y2="426"/>
      </g>
      <circle cx="280" cy="380" r="7" fill="#e8eaec"/>
      <circle cx="280" cy="325" r="3.5" fill="#ffb020">
        <animateTransform attributeName="transform" type="rotate" from="0 280 380" to="360 280 380" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="520" cy="380" r="70" fill="none" stroke="#222" stroke-width="10"/>
      <circle cx="520" cy="380" r="60" fill="none" stroke="#9aa3ab" stroke-width="3"/>
      <g stroke="#c8cdd2" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 520 380" to="360 520 380" dur="0.9s" repeatCount="indefinite"/>
        <line x1="520" y1="315" x2="520" y2="445"/>
        <line x1="455" y1="380" x2="585" y2="380"/>
        <line x1="474" y1="334" x2="566" y2="426"/>
        <line x1="566" y1="334" x2="474" y2="426"/>
      </g>
      <circle cx="520" cy="380" r="7" fill="#e8eaec"/>
      <circle cx="520" cy="325" r="3.5" fill="#ffb020">
        <animateTransform attributeName="transform" type="rotate" from="0 520 380" to="360 520 380" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="280" y1="380" x2="380" y2="380"/>
      <line x1="280" y1="380" x2="352" y2="252"/>
      <line x1="352" y1="252" x2="500" y2="268"/>
      <line x1="380" y1="380" x2="495" y2="272"/>
      <line x1="352" y1="252" x2="380" y2="380"/>
    </g>
    <!-- 前叉与车把 -->
    <path d="M520,380 L506,268 L528,258" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M494,252 Q506,244 530,258" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- 车座 -->
    <path d="M330,246 Q352,236 372,248 L368,258 Q350,250 336,256 Z" fill="#222"/>
    <!-- 链条 -->
    <circle cx="380" cy="380" r="19" fill="none" stroke="#555" stroke-width="5"/>
    <line x1="280" y1="372" x2="380" y2="368" stroke="#666" stroke-width="3" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="388" x2="380" y2="392" stroke="#666" stroke-width="3" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.4s" repeatCount="indefinite"/>
    </line>

    <!-- 曲柄 + 脚踏 + 脚（整体旋转） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 380 380" to="360 380 380" dur="0.9s" repeatCount="indefinite"/>
      <line x1="380" y1="380" x2="430" y2="380" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <line x1="380" y1="380" x2="330" y2="380" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <rect x="418" y="374" width="26" height="9" rx="4" fill="#222"/>
      <rect x="336" y="374" width="26" height="9" rx="4" fill="#222"/>
      <!-- 脚 -->
      <ellipse cx="436" cy="370" rx="14" ry="8" fill="#111"/>
      <ellipse cx="324" cy="370" rx="14" ry="8" fill="#111"/>
    </g>

    <!-- ====== 熊猫 ====== -->
    <!-- 远侧腿（相位差180°） -->
    <path fill="none" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round" opacity="0.75">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.25;0.5;0.75;1"
        values="M352,258 Q372,345 380,425;
                M352,258 Q348,318 334,376;
                M352,258 Q378,292 380,332;
                M352,258 Q402,302 428,374;
                M352,258 Q372,345 380,425"/>
    </path>

    <!-- 尾巴 -->
    <circle cx="342" cy="262" r="11" fill="#fff" stroke="#ddd" stroke-width="2"/>

    <!-- 身体 -->
    <g transform="rotate(-18 380 250)">
      <ellipse cx="380" cy="250" rx="48" ry="33" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
      <path d="M338,262 Q380,238 424,262 Q420,282 380,284 Q340,282 338,262 Z" fill="#1a1a1a"/>
    </g>

    <!-- 围巾 -->
    <path fill="#e63946">
      <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
        values="M398,206 Q360,210 330,196 Q356,222 398,220 Z;
                M398,206 Q358,204 326,186 Q358,216 398,220 Z;
                M398,206 Q360,210 330,196 Q356,222 398,220 Z"/>
    </path>
    <rect x="390" y="196" width="22" height="14" rx="6" fill="#c1121f" transform="rotate(-15 401 203)"/>

    <!-- 近侧腿 -->
    <path fill="none" stroke="#1a1a1a" stroke-width="15" stroke-linecap="round">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.25;0.5;0.75;1"
        values="M354,262 Q404,304 430,374;
                M354,262 Q380,294 382,334;
                M354,262 Q350,320 336,378;
                M354,262 Q374,347 382,427;
                M354,262 Q404,304 430,374"/>
    </path>

    <!-- 手臂 -->
    <path d="M412,196 Q458,208 498,258" fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <circle cx="500" cy="260" r="10" fill="#1a1a1a"/>

    <!-- 头部 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 405 190; 3 405 190; 0 405 190; -2 405 190; 0 405 190" dur="2s" repeatCount="indefinite"/>
      <!-- 耳朵 -->
      <circle cx="386" cy="122" r="16" fill="#1a1a1a"/>
      <circle cx="450" cy="122" r="16" fill="#1a1a1a"/>
      <!-- 脸 -->
      <circle cx="418" cy="158" r="46" fill="#ffffff" stroke="#ececec" stroke-width="2"/>
      <!-- 眼斑 -->
      <ellipse cx="402" cy="156" rx="10" ry="14" fill="#1a1a1a" transform="rotate(-15 402 156)"/>
      <ellipse cx="434" cy="156" rx="10" ry="14" fill="#1a1a1a" transform="rotate(15 434 156)"/>
      <!-- 眼睛（会眨） -->
      <circle cx="404" cy="154" r="4.5" fill="#fff">
        <animate attributeName="ry" values="4.5;4.5;0.5;4.5" keyTimes="0;0.9;0.95;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="432" cy="154" r="4.5" fill="#fff">
        <animate attributeName="ry" values="4.5;4.5;0.5;4.5" keyTimes="0;0.9;0.95;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="405.5" cy="154" r="2" fill="#111"/>
      <circle cx="433.5" cy="154" r="2" fill="#111"/>
      <!-- 鼻子和嘴 -->
      <ellipse cx="428" cy="176" rx="6.5" ry="4.5" fill="#1a1a1a"/>
      <path d="M428,182 q3,5 8,3 M428,182 q-1,6 -6,6" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round">
        <animate attributeName="d" values="M428,182 q3,5 8,3 M428,182 q-1,6 -6,6; M428,182 q4,6 9,4 M428,182 q-1,6 -6,6; M428,182 q3,5 8,3 M428,182 q-1,6 -6,6" dur="0.9s" repeatCount="indefinite"/>
      </path>
      <!-- 腮红 -->
      <circle cx="392" cy="176" r="6" fill="#ffb3b3" opacity="0.6"/>
      <circle cx="446" cy="174" r="6" fill="#ffb3b3" opacity="0.6"/>
    </g>
  </g>

  <!-- 路边小花 -->
  <g>
    <g transform="translate(640,452)">
      <line x1="0" y1="0" x2="0" y2="-14" stroke="#3f8f3f" stroke-width="2.5"/>
      <circle cx="0" cy="-17" r="5" fill="#ff8fab"/>
      <circle cx="0" cy="-17" r="2" fill="#ffd23f"/>
      <animateTransform attributeName="transform" type="rotate" values="-4 640 452; 4 640 452; -4 640 452" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(80,452)">
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#3f8f3f" stroke-width="2.5"/>
      <circle cx="0" cy="-15" r="4.5" fill="#c77dff"/>
      <circle cx="0" cy="-15" r="1.8" fill="#fff"/>
      <animateTransform attributeName="transform" type="rotate" values="3 80 452; -3 80 452; 3 80 452" dur="1.9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
