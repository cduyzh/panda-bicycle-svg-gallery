<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>熊猫骑自行车</title>
  <desc>一只戴红围巾的熊猫骑着红色自行车，车轮转动、双脚踩踏板，背景云朵和树木向后移动</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5dcf7"/>
      <stop offset="1" stop-color="#e8f9ff"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <g stroke="#ffd93b" stroke-width="6" stroke-linecap="round">
      <line x1="680" y1="30" x2="680" y2="50"/>
      <line x1="680" y1="150" x2="680" y2="170"/>
      <line x1="610" y1="100" x2="630" y2="100"/>
      <line x1="730" y1="100" x2="750" y2="100"/>
      <line x1="630" y1="50" x2="644" y2="64"/>
      <line x1="716" y1="136" x2="730" y2="150"/>
      <line x1="730" y1="50" x2="716" y2="64"/>
      <line x1="644" y1="136" x2="630" y2="150"/>
      <animateTransform attributeName="transform" type="rotate" from="0 680 100" to="360 680 100" dur="30s" repeatCount="indefinite"/>
    </g>
    <circle cx="680" cy="100" r="38" fill="#ffd93b"/>
    <circle cx="680" cy="100" r="32" fill="#ffe37a"/>
  </g>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <ellipse cx="0" cy="90" rx="45" ry="22"/>
      <ellipse cx="35" cy="80" rx="35" ry="20"/>
      <ellipse cx="-35" cy="82" rx="30" ry="16"/>
      <animateTransform attributeName="transform" type="translate" from="-150 0" to="900 0" dur="45s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="160" rx="38" ry="18"/>
      <ellipse cx="30" cy="150" rx="28" ry="16"/>
      <ellipse cx="-28" cy="152" rx="24" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="-120 0" to="900 0" dur="60s" begin="-25s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="60" rx="30" ry="14"/>
      <ellipse cx="24" cy="52" rx="22" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="-100 0" to="900 0" dur="52s" begin="-40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远山 -->
  <ellipse cx="180" cy="520" rx="260" ry="90" fill="#b5e39a"/>
  <ellipse cx="620" cy="530" rx="300" ry="100" fill="#a3d987"/>

  <!-- 地面 -->
  <rect x="0" y="510" width="800" height="90" fill="#7ec850"/>

  <!-- 远景树木（慢速滚动） -->
  <g>
    <g id="trees">
      <g>
        <rect x="196" y="430" width="10" height="60" fill="#8a5a2b"/>
        <circle cx="201" cy="415" r="32" fill="#4fae4f"/>
        <circle cx="182" cy="430" r="20" fill="#5cbf5c"/>
        <circle cx="220" cy="430" r="20" fill="#5cbf5c"/>
      </g>
      <g>
        <rect x="596" y="445" width="9" height="50" fill="#8a5a2b"/>
        <circle cx="600" cy="432" r="26" fill="#4fae4f"/>
        <circle cx="585" cy="444" r="16" fill="#5cbf5c"/>
        <circle cx="616" cy="444" r="16" fill="#5cbf5c"/>
      </g>
    </g>
    <use href="#trees" x="800"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="410" cy="516" rx="180" ry="10" fill="#5da83a" opacity="0.6"/>

  <!-- 近景草丛与花（快速滚动） -->
  <g>
    <g id="grass">
      <path d="M80 515 q4 -14 8 0 M88 515 q4 -10 8 0" stroke="#4e9e34" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M230 518 q4 -14 8 0 M238 518 q4 -10 8 0" stroke="#4e9e34" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M390 514 q4 -14 8 0 M398 514 q4 -10 8 0" stroke="#4e9e34" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M560 518 q4 -14 8 0 M568 518 q4 -10 8 0" stroke="#4e9e34" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M720 515 q4 -14 8 0 M728 515 q4 -10 8 0" stroke="#4e9e34" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#ff8fb3">
        <circle cx="150" cy="522" r="5"/><circle cx="143" cy="526" r="4"/><circle cx="157" cy="526" r="4"/>
        <circle cx="150" cy="524" r="2.5" fill="#fff3f7"/>
      </g>
      <g fill="#ffd93b">
        <circle cx="460" cy="524" r="5"/><circle cx="453" cy="528" r="4"/><circle cx="467" cy="528" r="4"/>
        <circle cx="460" cy="526" r="2.5" fill="#fffbe0"/>
      </g>
      <g fill="#ffffff">
        <circle cx="645" cy="522" r="5"/><circle cx="638" cy="526" r="4"/><circle cx="652" cy="526" r="4"/>
        <circle cx="645" cy="524" r="2.5" fill="#ffd93b"/>
      </g>
    </g>
    <use href="#grass" x="800"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <g>
    <!-- 后轮 -->
    <g>
      <circle cx="300" cy="450" r="60" fill="none" stroke="#222" stroke-width="10"/>
      <circle cx="300" cy="450" r="49" fill="none" stroke="#bbb" stroke-width="3"/>
      <g stroke="#8a8a8a" stroke-width="3">
        <line x1="300" y1="402" x2="300" y2="498"/>
        <line x1="252" y1="450" x2="348" y2="450"/>
        <line x1="300" y1="402" x2="300" y2="498" transform="rotate(45 300 450)"/>
        <line x1="252" y1="450" x2="348" y2="450" transform="rotate(45 300 450)"/>
        <circle cx="300" cy="420" r="5" fill="#ff5a5a" stroke="none"/>
        <animateTransform attributeName="transform" type="rotate" from="0 300 450" to="360 300 450" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle cx="300" cy="450" r="8" fill="#555"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="520" cy="450" r="60" fill="none" stroke="#222" stroke-width="10"/>
      <circle cx="520" cy="450" r="49" fill="none" stroke="#bbb" stroke-width="3"/>
      <g stroke="#8a8a8a" stroke-width="3">
        <line x1="520" y1="402" x2="520" y2="498"/>
        <line x1="472" y1="450" x2="568" y2="450"/>
        <line x1="520" y1="402" x2="520" y2="498" transform="rotate(45 520 450)"/>
        <line x1="472" y1="450" x2="568" y2="450" transform="rotate(45 520 450)"/>
        <circle cx="520" cy="420" r="5" fill="#ff5a5a" stroke="none"/>
        <animateTransform attributeName="transform" type="rotate" from="0 520 450" to="360 520 450" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle cx="520" cy="450" r="8" fill="#555"/>
    </g>

    <!-- 链条 -->
    <line x1="300" y1="443" x2="395" y2="430" stroke="#777" stroke-width="3"/>
    <line x1="300" y1="457" x2="395" y2="460" stroke="#777" stroke-width="3"/>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="300" y1="450" x2="392" y2="447"/>
      <line x1="392" y1="447" x2="358" y2="334"/>
      <line x1="300" y1="450" x2="360" y2="338"/>
      <line x1="392" y1="447" x2="492" y2="330"/>
      <line x1="362" y1="338" x2="492" y2="330"/>
      <line x1="520" y1="450" x2="505" y2="320"/>
    </g>

    <!-- 车座 -->
    <line x1="358" y1="334" x2="356" y2="328" stroke="#555" stroke-width="5"/>
    <ellipse cx="355" cy="327" rx="20" ry="7" fill="#222"/>

    <!-- 车把 -->
    <line x1="505" y1="320" x2="500" y2="294" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>
    <line x1="486" y1="294" x2="520" y2="294" stroke="#333" stroke-width="7" stroke-linecap="round"/>

    <!-- 牙盘与曲柄脚踏 -->
    <circle cx="395" cy="445" r="16" fill="none" stroke="#999" stroke-width="4"/>
    <circle cx="300" cy="450" r="7" fill="none" stroke="#999" stroke-width="3"/>
    <g>
      <line x1="395" y1="445" x2="423" y2="445" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <rect x="417" y="441" width="15" height="8" rx="2" fill="#333"/>
      <line x1="395" y1="445" x2="367" y2="445" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <rect x="360" y="441" width="15" height="8" rx="2" fill="#333"/>
      <animateTransform attributeName="transform" type="rotate" from="0 395 445" to="360 395 445" dur="2s" repeatCount="indefinite"/>
    </g>
    <circle cx="395" cy="445" r="5" fill="#555"/>
  </g>

  <!-- ============ 熊猫 ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" keyTimes="0; 0.5; 1" dur="1s" repeatCount="indefinite"/>

    <!-- 尾巴 -->
    <circle cx="330" cy="298" r="12" fill="#fff" stroke="#ddd" stroke-width="2"/>

    <!-- 后腿（远端，相位差180度） -->
    <line x1="362" y1="310" x2="367" y2="445" stroke="#4a4a4a" stroke-width="15" stroke-linecap="round">
      <animate attributeName="x2" values="367;395;423;395;367" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="445;417;445;473;445" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
    </line>
    <circle cx="367" cy="445" r="10" fill="#4a4a4a">
      <animate attributeName="cx" values="367;395;423;395;367" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="445;417;445;473;445" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- 身体 -->
    <ellipse cx="378" cy="290" rx="46" ry="56" fill="#ffffff" stroke="#e5e5e5" stroke-width="2" transform="rotate(-16 378 290)"/>
    <!-- 肩部黑色披肩 -->
    <ellipse cx="386" cy="262" rx="40" ry="20" fill="#222" transform="rotate(-16 386 262)"/>

    <!-- 前腿（近端） -->
    <line x1="366" y1="312" x2="423" y2="445" stroke="#1a1a1a" stroke-width="15" stroke-linecap="round">
      <animate attributeName="x2" values="423;395;367;395;423" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="445;473;445;417;445" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
    </line>
    <circle cx="423" cy="445" r="10" fill="#1a1a1a">
      <animate attributeName="cx" values="423;395;367;395;423" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="445;473;445;417;445" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- 后手臂 -->
    <line x1="382" y1="262" x2="500" y2="292" stroke="#4a4a4a" stroke-width="13" stroke-linecap="round"/>

    <!-- 头 -->
    <g>
      <circle cx="380" cy="146" r="15" fill="#222"/>
      <circle cx="452" cy="149" r="15" fill="#222"/>
      <circle cx="416" cy="192" r="50" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
      <!-- 黑眼圈 -->
      <ellipse cx="398" cy="186" rx="9" ry="13" fill="#222" transform="rotate(-18 398 186)"/>
      <ellipse cx="436" cy="186" rx="9" ry="13" fill="#222" transform="rotate(18 436 186)"/>
      <!-- 眼睛 -->
      <circle cx="399" cy="184" r="3" fill="#fff"/>
      <circle cx="400" cy="185" r="1.6" fill="#222"/>
      <circle cx="435" cy="184" r="3" fill="#fff"/>
      <circle cx="436" cy="185" r="1.6" fill="#222"/>
      <!-- 鼻子和嘴 -->
      <ellipse cx="417" cy="208" rx="6.5" ry="4.5" fill="#222"/>
      <path d="M409 216 Q417 223 425 216" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 腮红 -->
      <circle cx="388" cy="206" r="6" fill="#ffb3c6" opacity="0.7"/>
      <circle cx="446" cy="206" r="6" fill="#ffb3c6" opacity="0.7"/>
    </g>

    <!-- 前手臂 -->
    <line x1="394" y1="270" x2="508" y2="296" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round"/>

    <!-- 红围巾（飘动） -->
    <path fill="#e63946">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        values="M386 236 C352 224 328 236 300 218 L305 242 C330 254 356 246 388 252 Z;
                M386 236 C350 248 330 220 302 240 L307 260 C332 246 356 258 388 252 Z;
                M386 236 C352 224 328 236 300 218 L305 242 C330 254 356 246 388 252 Z"/>
    </path>
    <ellipse cx="392" cy="242" rx="16" ry="12" fill="#c1121f"/>
  </g>
</svg>
