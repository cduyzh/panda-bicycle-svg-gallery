<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff6ff"/>
      <stop offset="100%" stop-color="#f8fdff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8e986"/>
      <stop offset="100%" stop-color="#8ed46b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style>
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
      .bike-bob { transform-box: fill-box; transform-origin: center; animation: bob 1.2s ease-in-out infinite; }
      .panda-bob { transform-box: fill-box; transform-origin: 50% 70%; animation: pandaBob 1.2s ease-in-out infinite; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
      .leg-l { transform-box: fill-box; transform-origin: 50% 10%; animation: legL .8s ease-in-out infinite; }
      .leg-r { transform-box: fill-box; transform-origin: 50% 10%; animation: legR .8s ease-in-out infinite; }
      .arm { transform-box: fill-box; transform-origin: 80% 20%; animation: arm 1.2s ease-in-out infinite; }
      .ear-l { transform-box: fill-box; transform-origin: 60% 60%; animation: earL 1.2s ease-in-out infinite; }
      .ear-r { transform-box: fill-box; transform-origin: 40% 60%; animation: earR 1.2s ease-in-out infinite; }
      .clouds { animation: drift 12s linear infinite; }
      .roadmarks { animation: road 1.2s linear infinite; }
      .bamboo1 { animation: bamboo 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
      .bamboo2 { animation: bamboo 3.2s ease-in-out .6s infinite; transform-origin: 50% 100%; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes pandaBob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
      @keyframes legL { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-26deg); } }
      @keyframes legR { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(18deg); } }
      @keyframes arm { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(4deg); } }
      @keyframes earL { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
      @keyframes earR { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-5deg); } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-260px); } }
      @keyframes road { from { transform: translateX(0); } to { transform: translateX(-120px); } }
      @keyframes bamboo { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(2deg); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="790" cy="92" r="44" fill="#ffd86b" opacity=".9"/>

  <g class="clouds" fill="#fff" opacity=".92">
    <g transform="translate(90 90)">
      <ellipse cx="0" cy="0" rx="42" ry="18"/>
      <ellipse cx="35" cy="-10" rx="32" ry="21"/>
      <ellipse cx="70" cy="2" rx="40" ry="18"/>
    </g>
    <g transform="translate(410 120)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/>
      <ellipse cx="31" cy="-11" rx="28" ry="20"/>
      <ellipse cx="62" cy="2" rx="36" ry="16"/>
    </g>
    <g transform="translate(790 145)">
      <ellipse cx="0" cy="0" rx="40" ry="17"/>
      <ellipse cx="34" cy="-11" rx="30" ry="20"/>
      <ellipse cx="66" cy="2" rx="39" ry="17"/>
    </g>
    <g transform="translate(1050 95)">
      <ellipse cx="0" cy="0" rx="42" ry="18"/>
      <ellipse cx="35" cy="-10" rx="32" ry="21"/>
      <ellipse cx="70" cy="2" rx="40" ry="18"/>
    </g>
  </g>

  <rect y="325" width="960" height="80" fill="url(#grass)"/>
  <rect y="405" width="960" height="135" fill="#6f7277"/>
  <rect y="405" width="960" height="10" fill="#55585d"/>

  <!-- Bamboo decoration -->
  <g class="bamboo1" transform="translate(80 225)">
    <rect x="0" y="0" width="14" height="105" rx="7" fill="#5faa54"/>
    <path d="M7 18 C-18 5,-32 14,-42 33 C-16 34,-3 29,7 18Z" fill="#78c86f"/>
    <path d="M8 44 C30 30,44 38,53 56 C28 58,16 54,8 44Z" fill="#78c86f"/>
    <path d="M7 70 C-16 58,-30 65,-39 82 C-15 84,-2 79,7 70Z" fill="#78c86f"/>
  </g>
  <g class="bamboo2" transform="translate(865 235)">
    <rect x="0" y="0" width="14" height="95" rx="7" fill="#5faa54"/>
    <path d="M7 18 C-18 5,-30 12,-40 29 C-16 31,-3 27,7 18Z" fill="#78c86f"/>
    <path d="M8 45 C28 31,42 37,50 54 C27 56,16 52,8 45Z" fill="#78c86f"/>
  </g>

  <!-- road marks -->
  <g class="roadmarks" fill="#f9f2c3">
    <rect x="-40" y="470" width="78" height="8" rx="4"/>
    <rect x="80" y="470" width="78" height="8" rx="4"/>
    <rect x="200" y="470" width="78" height="8" rx="4"/>
    <rect x="320" y="470" width="78" height="8" rx="4"/>
    <rect x="440" y="470" width="78" height="8" rx="4"/>
    <rect x="560" y="470" width="78" height="8" rx="4"/>
    <rect x="680" y="470" width="78" height="8" rx="4"/>
    <rect x="800" y="470" width="78" height="8" rx="4"/>
    <rect x="920" y="470" width="78" height="8" rx="4"/>
    <rect x="1040" y="470" width="78" height="8" rx="4"/>
  </g>

  <!-- shadow -->
  <ellipse cx="490" cy="463" rx="205" ry="22" fill="#000" opacity=".15" filter="url(#shadow)"/>

  <!-- Bicycle -->
  <g class="bike-bob">
    <!-- wheels -->
    <g class="wheel">
      <circle cx="360" cy="414" r="92" fill="none" stroke="#20252b" stroke-width="10"/>
      <circle cx="360" cy="414" r="7" fill="#20252b"/>
      <g stroke="#65707a" stroke-width="3" opacity=".9">
        <line x1="360" y1="322" x2="360" y2="506"/>
        <line x1="268" y1="414" x2="452" y2="414"/>
        <line x1="295" y1="349" x2="425" y2="479"/>
        <line x1="295" y1="479" x2="425" y2="349"/>
      </g>
    </g>
    <g class="wheel">
      <circle cx="626" cy="414" r="92" fill="none" stroke="#20252b" stroke-width="10"/>
      <circle cx="626" cy="414" r="7" fill="#20252b"/>
      <g stroke="#65707a" stroke-width="3" opacity=".9">
        <line x1="626" y1="322" x2="626" y2="506"/>
        <line x1="534" y1="414" x2="718" y2="414"/>
        <line x1="561" y1="349" x2="691" y2="479"/>
        <line x1="561" y1="479" x2="691" y2="349"/>
      </g>
    </g>

    <!-- frame -->
    <g fill="none" stroke="#ef5858" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M360 414 L438 332 L515 414 L360 414 Z"/>
      <path d="M438 332 L560 328 L515 414"/>
      <path d="M560 328 L626 414"/>
    </g>
    <path d="M553 330 L576 282" stroke="#20252b" stroke-width="9" stroke-linecap="round"/>
    <path d="M565 284 L610 284" stroke="#20252b" stroke-width="8" stroke-linecap="round"/>
    <path d="M420 325 L462 325" stroke="#20252b" stroke-width="10" stroke-linecap="round"/>

    <!-- crank -->
    <g class="pedal">
      <circle cx="515" cy="414" r="18" fill="#20252b"/>
      <line x1="515" y1="414" x2="550" y2="438" stroke="#20252b" stroke-width="7" stroke-linecap="round"/>
      <line x1="515" y1="414" x2="480" y2="390" stroke="#20252b" stroke-width="7" stroke-linecap="round"/>
      <rect x="543" y="434" width="28" height="8" rx="4" fill="#20252b"/>
      <rect x="459" y="386" width="28" height="8" rx="4" fill="#20252b"/>
    </g>
  </g>

  <!-- Panda -->
  <g class="panda-bob">
    <!-- torso -->
    <ellipse cx="488" cy="270" rx="72" ry="84" fill="#fff" stroke="#20252b" stroke-width="5"/>

    <!-- legs -->
    <g class="leg-l">
      <path d="M459 326 C452 350,455 378,479 401" fill="none" stroke="#20252b" stroke-width="22" stroke-linecap="round"/>
      <ellipse cx="481" cy="402" rx="18" ry="12" fill="#20252b"/>
    </g>
    <g class="leg-r">
      <path d="M520 327 C532 350,534 381,551 405" fill="none" stroke="#20252b" stroke-width="22" stroke-linecap="round"/>
      <ellipse cx="552" cy="406" rx="18" ry="12" fill="#20252b"/>
    </g>

    <!-- arms -->
    <g class="arm">
      <path d="M532 245 C555 255,573 269,586 285" fill="none" stroke="#20252b" stroke-width="23" stroke-linecap="round"/>
    </g>
    <path d="M440 250 C425 267,414 284,404 305" fill="none" stroke="#20252b" stroke-width="23" stroke-linecap="round"/>

    <!-- head -->
    <g>
      <g class="ear-l"><circle cx="442" cy="166" r="31" fill="#20252b"/></g>
      <g class="ear-r"><circle cx="531" cy="166" r="31" fill="#20252b"/></g>
      <ellipse cx="487" cy="192" rx="69" ry="61" fill="#fff" stroke="#20252b" stroke-width="5"/>

      <!-- eye patches -->
      <g transform="rotate(-12 461 191)">
        <ellipse cx="461" cy="191" rx="24" ry="31" fill="#20252b"/>
        <ellipse cx="462" cy="193" rx="8" ry="12" fill="#fff"/>
      </g>
      <g transform="rotate(12 512 191)">
        <ellipse cx="512" cy="191" rx="24" ry="31" fill="#20252b"/>
        <ellipse cx="511" cy="193" rx="8" ry="12" fill="#fff"/>
      </g>

      <ellipse cx="487" cy="216" rx="10" ry="8" fill="#20252b"/>
      <path d="M476 226 Q487 238 499 226" fill="none" stroke="#20252b" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="441" cy="219" rx="13" ry="7" fill="#f5a7ae" opacity=".65"/>
      <ellipse cx="532" cy="219" rx="13" ry="7" fill="#f5a7ae" opacity=".65"/>
    </g>

    <!-- shirt -->
    <path d="M430 246 Q487 270 546 246 L550 314 Q490 337 424 314 Z" fill="#6ec1ff" opacity=".95"/>
    <circle cx="487" cy="284" r="16" fill="#fff" opacity=".9"/>
    <path d="M481 281 l6 8 7-8" fill="none" stroke="#3d78a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small motion accents -->
  <g fill="none" stroke="#7fb5c8" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M250 343 q-24 4 -40 18"/>
    <path d="M238 364 q-22 5 -35 16"/>
    <path d="M717 348 q25 5 38 18"/>
  </g>

  <text x="480" y="55" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30" font-weight="700" fill="#263238">熊猫骑行中</text>
</svg>