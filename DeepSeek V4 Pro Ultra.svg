    <rect x="0" y="552" width="58" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="140" y="552" width="58" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="280" y="552" width="58" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="420" y="552" width="58" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="560" y="552" width="58" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="700" y="552" width="58" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="840" y="552" width="58" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
