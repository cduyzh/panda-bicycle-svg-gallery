      <circle cx="450" cy="122" r="16" fill="#1a1a1a"/>
      <circle cx="386" cy="122" r="6" fill="#ffb3b3" opacity="0.5"/>
      <circle cx="450" cy="122" r="6" fill="#ffb3b3" opacity="0.5"/>
