                M350,257 Q377.9,287.6 380,329;
                M350,257 Q394.2,292 416.1,343.9;
                M350,257 Q402.2,310.8 431,380;
                M350,257 Q396,331.2 416.1,416.1;
                M350,257 Q378.8,341.6 380,431;
                M350,257 Q361,337.1 343.9,416.1;
