      <ellipse cx="0" cy="110" rx="55" ry="20"/>
      <ellipse cx="-35" cy="100" rx="35" ry="16"/>
      <ellipse cx="38" cy="102" rx="30" ry="14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1000 0; -300 0" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="60" rx="42" ry="15"/>
      <ellipse cx="-28" cy="52" rx="26" ry="12"/>
      <ellipse cx="30" cy="53" rx="24" ry="11"/>
