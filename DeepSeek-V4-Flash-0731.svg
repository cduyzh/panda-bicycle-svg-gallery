        <rect x="316" y="374" width="26" height="9" rx="4" fill="#222"/>
        <ellipse cx="329" cy="372" rx="12" ry="7.5" fill="#111" opacity="0.8"/>
      </g>
    </g>
    <!-- 近侧脚踏 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 380 380" to="360 380 380" dur="0.9s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 431 380" to="-360 431 380" dur="0.9s" repeatCount="indefinite"/>
        <rect x="418" y="374" width="26" height="9" rx="4" fill="#222"/>
        <ellipse cx="431" cy="371" rx="15" ry="9" fill="#111"/>
        <ellipse cx="426" cy="367" rx="7" ry="3.5" fill="#3a3a3a" opacity="0.6"/>
