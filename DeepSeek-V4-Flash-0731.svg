    </circle>
    <!-- 太阳笑脸 -->
    <circle cx="-12" cy="-6" r="3.5" fill="#e0932e"/>
    <circle cx="12" cy="-6" r="3.5" fill="#e0932e"/>
    <path d="M-7,8 Q0,15 7,8" fill="none" stroke="#e0932e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 云朵 -->
