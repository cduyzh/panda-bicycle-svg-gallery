<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>熊猫骑自行车</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <g id="bamboo">
      <rect x="30" y="200" width="16" height="220" rx="6" fill="#5fb363" stroke="#3b7d3e" stroke-width="2"/>
      <rect x="28" y="258" width="20" height="4" rx="2" fill="#3b7d3e"/>
      <rect x="28" y="318" width="20" height="4" rx="2" fill="#3b7d3e"/>
      <rect x="28" y="378" width="20" height="4" rx="2" fill="#3b7d3e"/>
      <path d="M46 215 Q72 194 86 212 Q66 224 46 219Z" fill="#7fd17f" stroke="#3b7d3e" stroke-width="1.5"/>
      <rect x="170" y="160" width="14" height="260" rx="6" fill="#5fb363" stroke="#3b7d3e" stroke-width="2"/>
      <rect x="168" y="220" width="18" height="4" rx="2" fill="#3b7d3e"/>
      <rect x="168" y="280" width="18" height="4" rx="2" fill="#3b7d3e"/>
      <rect x="168" y="340" width="18" height="4" rx="2" fill="#3b7d3e"/>
      <rect x="168" y="400" width="18" height="4" rx="2" fill="#3b7d3e"/>
      <path d="M184 170 Q210 150 224 168 Q206 180 184 176Z" fill="#7fd17f" stroke="#3b7d3e" stroke-width="1.5"/>
      <path d="M170 200 Q150 184 138 196 Q152 210 170 207Z" fill="#7fd17f" stroke="#3b7d3e" stroke-width="1.5"/>
      <rect x="262" y="230" width="12" height="190" rx="5" fill="#6cbc6a" stroke="#3b7d3e" stroke-width="2"/>
      <rect x="260" y="290" width="16" height="4" rx="2" fill="#3b7d3e"/>
      <rect x="260" y="350" width="16" height="4" rx="2" fill="#3b7d3e"/>
      <path d="M274 240 Q296 222 306 240 Q290 250 274 246Z" fill="#7fd17f" stroke="#3b7d3e" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- sky, sun -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="38" fill="#ffd65c"/>

  <!-- drifting clouds -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="900 0" to="-250 0" dur="24s" repeatCount="indefinite"/>
    <g transform="translate(0 70)" fill="#ffffff" opacity="0.92">
      <ellipse cx="0" cy="0" rx="40" ry="16"/>
      <ellipse cx="22" cy="-10" rx="26" ry="20"/>
      <ellipse cx="-22" cy="-6" rx="22" ry="15"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="900 0" to="-250 0" dur="30s" begin="-12s" repeatCount="indefinite"/>
    <g transform="translate(0 130) scale(0.8)" fill="#ffffff" opacity="0.85">
      <ellipse cx="0" cy="0" rx="40" ry="16"/>
      <ellipse cx="22" cy="-10" rx="26" ry="20"/>
      <ellipse cx="-22" cy="-6" rx="22" ry="15"/>
    </g>
  </g>

  <!-- hills -->
  <path d="M0 370 Q90 310 200 350 T420 335 T800 345 L800 440 L0 440Z" fill="#a9e3a0"/>
  <path d="M0 395 Q120 350 260 390 T560 380 T800 392 L800 440 L0 440Z" fill="#8fd58a"/>

  <!-- scrolling bamboo (parallax) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="3.75s" repeatCount="indefinite"/>
    <use href="#bamboo"/>
    <use href="#bamboo" x="300"/>
    <use href="#bamboo" x="600"/>
    <use href="#bamboo" x="900"/>
  </g>

  <!-- road with moving dashes -->
  <rect x="0" y="430" width="800" height="70" fill="#7d838c"/>
  <rect x="0" y="430" width="800" height="5" fill="#5f656d"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.46s" repeatCount="indefinite"/>
    <rect x="0" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
    <rect x="120" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
    <rect x="240" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
    <rect x="360" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
    <rect x="480" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
    <rect x="600" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
    <rect x="720" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
    <rect x="840" y="468" width="60" height="6" rx="3" fill="#ffffff"/>
  </g>

  <!-- rear wheel -->
  <g transform="translate(250 375)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="50" fill="none" stroke="#222222" stroke-width="8"/>
      <circle r="44" fill="none" stroke="#c9ced6" stroke-width="2"/>
      <path d="M0 0L46 0M0 0L0 46M0 0L-46 0M0 0L0 -46M0 0L32.5 32.5M0 0L-32.5 -32.5M0 0L-32.5 32.5M0 0L32.5 -32.5" stroke="#9aa3ad" stroke-width="1.5"/>
      <circle r="6" fill="#555555"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(440 375)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="50" fill="none" stroke="#222222" stroke-width="8"/>
      <circle r="44" fill="none" stroke="#c9ced6" stroke-width="2"/>
      <path d="M0 0L46 0M0 0L0 46M0 0L-46 0M0 0L0 -46M0 0L32.5 32.5M0 0L-32.5 -32.5M0 0L-32.5 32.5M0 0L32.5 -32.5" stroke="#9aa3ad" stroke-width="1.5"/>
      <circle r="6" fill="#555555"/>
    </g>
  </g>

  <!-- bicycle frame -->
  <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M250 375 L330 385"/>
    <path d="M250 375 L292 277"/>
    <path d="M330 385 L292 277"/>
    <path d="M292 277 L425 272"/>
    <path d="M330 385 L428 300"/>
    <path d="M425 272 L432 240"/>
    <path d="M428 300 L440 375"/>
    <path d="M432 240 Q452 230 470 238" stroke="#333333" stroke-width="6"/>
  </g>
  <rect x="268" y="272" width="46" height="10" rx="5" fill="#222222"/>

  <!-- far arm (behind body) -->
  <path d="M312 206 Q384 198 450 242" fill="none" stroke="#333333" stroke-width="16" stroke-linecap="round"/>

  <!-- legs: hip fixed, feet follow the pedals -->
  <path fill="none" stroke="#2b2b2b" stroke-width="20" stroke-linecap="round" d="M305 262Q332 324 308 385">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M305 262Q332 324 308 385;M305 262Q335 316 314 369;M305 262Q343 313 330 363;M305 262Q351 316 346 369;M305 262Q354 324 352 385;M305 262Q351 332 346 401;M305 262Q343 335 330 407;M305 262Q335 332 314 401;M305 262Q332 324 308 385"/>
  </path>
  <path fill="none" stroke="#111111" stroke-width="20" stroke-linecap="round" d="M305 262Q354 324 352 385">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M305 262Q354 324 352 385;M305 262Q351 332 346 401;M305 262Q343 335 330 407;M305 262Q335 332 314 401;M305 262Q332 324 308 385;M305 262Q335 316 314 369;M305 262Q343 313 330 363;M305 262Q351 316 346 369;M305 262Q354 324 352 385"/>
  </path>

  <!-- crank, pedals and shoes -->
  <g transform="translate(330 385)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <path d="M-22 0L22 0" stroke="#555555" stroke-width="6" stroke-linecap="round"/>
      <circle r="9" fill="none" stroke="#777777" stroke-width="2.5"/>
      <circle r="4" fill="#444444"/>
      <ellipse cx="22" cy="0" rx="10" ry="6" fill="#222222"/>
      <ellipse cx="-22" cy="0" rx="10" ry="6" fill="#222222"/>
    </g>
  </g>

  <!-- body -->
  <ellipse cx="305" cy="222" rx="44" ry="54" fill="#ffffff" stroke="#222222" stroke-width="2.5"/>
  <ellipse cx="282" cy="212" rx="14" ry="22" fill="#1c1c1c" transform="rotate(-15 282 212)"/>

  <!-- near arm on handlebar -->
  <path d="M322 200 Q390 190 458 236" fill="none" stroke="#1c1c1c" stroke-width="18" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="268" cy="90" r="17" fill="#1c1c1c"/>
  <circle cx="342" cy="90" r="17" fill="#1c1c1c"/>
  <circle cx="305" cy="128" r="46" fill="#ffffff" stroke="#222222" stroke-width="2.5"/>
  <path d="M259 116 Q255 74 305 72 Q355 74 351 116 Q305 106 259 116Z" fill="#e63946" stroke="#8b1d25" stroke-width="2"/>
  <path d="M272 92 Q305 80 338 92" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <ellipse cx="284" cy="128" rx="15" ry="19" fill="#1c1c1c" transform="rotate(-20 284 128)"/>
  <ellipse cx="326" cy="128" rx="15" ry="19" fill="#1c1c1c" transform="rotate(20 326 128)"/>

  <ellipse cx="286" cy="126" rx="5.5" ry="5.5" fill="#ffffff">
    <animate attributeName="ry" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.9;0.94;0.98;1" values="5.5;5.5;0.5;5.5;5.5"/>
  </ellipse>
  <ellipse cx="287" cy="127" rx="2.6" ry="2.6" fill="#1c1c1c">
    <animate attributeName="ry" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.9;0.94;0.98;1" values="2.6;2.6;0.3;2.6;2.6"/>
  </ellipse>
  <ellipse cx="324" cy="126" rx="5.5" ry="5.5" fill="#ffffff">
    <animate attributeName="ry" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.9;0.94;0.98;1" values="5.5;5.5;0.5;5.5;5.5"/>
  </ellipse>
  <ellipse cx="325" cy="127" rx="2.6" ry="2.6" fill="#1c1c1c">
    <animate attributeName="ry" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.9;0.94;0.98;1" values="2.6;2.6;0.3;2.6;2.6"/>
  </ellipse>

  <ellipse cx="305" cy="151" rx="8" ry="6" fill="#1c1c1c"/>
  <path d="M296 161 Q305 170 314 161" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="270" cy="152" r="7" fill="#ffb3b3" opacity="0.7"/>
  <circle cx="340" cy="152" r="7" fill="#ffb3b3" opacity="0.7"/>
  <path d="M352 96 Q358 106 352 112 Q346 106 352 96Z" fill="#7fd6ff" stroke="#3aa6d8" stroke-width="1"/>
</svg>
