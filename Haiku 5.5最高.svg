<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="500" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>熊猫骑自行车</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="0.62" stop-color="#d9f1ff"/>
      <stop offset="1" stop-color="#ffecc9"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9c8"/>
      <stop offset="1" stop-color="#9fd39a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cdbb"/>
      <stop offset="1" stop-color="#b6a894"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud" fill="#ffffff">
      <circle cx="-14" cy="4" r="17"/>
      <circle cx="14" cy="-4" r="24"/>
      <circle cx="42" cy="6" r="17"/>
      <rect x="-31" y="4" width="90" height="24" rx="12"/>
    </g>
    <g id="clump">
      <rect x="0" y="-200" width="10" height="200" rx="5" fill="#6cbc5c"/>
      <rect x="16" y="-240" width="9" height="240" rx="4.5" fill="#58a84d"/>
      <rect x="30" y="-170" width="8" height="170" rx="4" fill="#7fcd6e"/>
      <path fill="#43853c" d="M-1-60h12v3h-12zM-1-120h12v3h-12zM-1-180h12v3h-12zM15-80h11v3h-11zM15-150h11v3h-11zM15-210h11v3h-11zM29-70h10v3h-10zM29-130h10v3h-10z"/>
      <path fill="#4f9d47" d="M10-150Q26-168 40-180Q24-152 10-150Z"/>
      <path fill="#4f9d47" d="M0-100Q-14-118-26-132Q-12-116 0-100Z"/>
      <path fill="#4f9d47" d="M15-210Q30-226 44-234Q28-214 15-210Z"/>
      <path fill="#4f9d47" d="M30-130Q44-146 56-154Q42-138 30-130Z"/>
    </g>
    <g id="tile">
      <use xlink:href="#clump" x="20" y="428"/>
      <use xlink:href="#clump" transform="translate(150 428) scale(0.8)"/>
      <use xlink:href="#clump" transform="translate(262 428) scale(0.95)"/>
    </g>
    <g id="wheel">
      <circle r="54" fill="none" stroke="#1f2328" stroke-width="7"/>
      <circle r="50" fill="none" stroke="#c9c3b8" stroke-width="2"/>
      <path d="M-50 0H50M0-50V50M-35-35L35 35M-35 35L35-35" fill="none" stroke="#a39c90" stroke-width="1.5"/>
      <circle r="6" fill="#4a4f57"/>
      <circle r="2.5" fill="#e6e0d6"/>
      <circle cy="-54" r="3.6" fill="#e4572e"/>
    </g>
  </defs>

  <!-- sky, sun and clouds -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <g transform="translate(690 96)">
    <circle r="80" fill="url(#glow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <path d="M0-46V-60M33-33L42-42M46 0H60M33 33L42 42M0 46V60M-33 33L-42 42M-46 0H-60M-33-33L-42-42" fill="none" stroke="#ffd45c" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle r="33" fill="#ffd96b"/>
  </g>
  <g transform="translate(160 0)">
    <animateTransform attributeName="transform" type="translate" from="900 0" to="-160 0" dur="40s" repeatCount="indefinite"/>
    <use xlink:href="#cloud" transform="translate(0 112)"/>
  </g>
  <g transform="translate(520 0)">
    <animateTransform attributeName="transform" type="translate" from="900 0" to="-160 0" dur="46s" begin="-24s" repeatCount="indefinite"/>
    <use xlink:href="#cloud" transform="translate(0 176) scale(0.7)"/>
  </g>

  <!-- distant hills and bamboo grove -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="24s" repeatCount="indefinite"/>
    <path fill="url(#hill)" d="M-400 350Q-300 280-200 345Q-100 310 0 350Q100 280 200 345Q300 310 400 350Q500 280 600 345Q700 310 800 350Q900 280 1000 345Q1100 310 1200 350Q1300 280 1400 345Q1500 310 1600 350L1600 470L-400 470Z"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-360 0" dur="1.5s" repeatCount="indefinite"/>
    <use xlink:href="#tile" x="0"/>
    <use xlink:href="#tile" x="360"/>
    <use xlink:href="#tile" x="720"/>
    <use xlink:href="#tile" x="1080"/>
  </g>

  <!-- road with moving centre dashes -->
  <rect x="0" y="422" width="800" height="78" fill="url(#road)"/>
  <rect x="0" y="420" width="800" height="5" fill="#f3ecdf"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.333s" repeatCount="indefinite"/>
    <line x1="-120" y1="460" x2="1000" y2="460" stroke="#fffaf0" stroke-width="6" stroke-dasharray="54 66"/>
  </g>
  <ellipse cx="386" cy="424" rx="132" ry="7" fill="#4a3b25" opacity="0.2"/>

  <!-- rear and front wheels -->
  <g transform="translate(300 365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>
  <g transform="translate(470 365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <use xlink:href="#wheel"/>
    </g>
  </g>

  <!-- panda tail -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1s" repeatCount="indefinite"/>
    <circle cx="318" cy="252" r="9" fill="#ffffff" stroke="#d6d0c6" stroke-width="1"/>
  </g>

  <!-- far leg, pedal and shoe (half a cycle ahead of the near leg) -->
  <path d="M334 244L408.4 273.5L366 339" fill="none" stroke="#343434" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round">
    <animate attributeName="d" dur="1s" begin="-0.5s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="M334 244L373.8 313.4L366 391;M334 244L377.3 311.3L347.6 383.4;M334 244L387.7 303.3L340 365;M334 244L400.2 289L347.6 346.6;M334 244L408.4 273.5L366 339;M334 244L408.8 272.5L384.4 346.6;M334 244L401.1 287.5L392 365;M334 244L385.3 305.4L384.4 383.4;M334 244L373.8 313.4L366 391"/>
  </path>
  <g transform="translate(366 365)">
    <rect x="-9" y="-28" width="18" height="4" rx="2" fill="#6b645a">
      <animateMotion dur="1s" begin="-0.5s" repeatCount="indefinite" path="M0 52A26 26 0 0 1-26 26A26 26 0 0 1 0 0A26 26 0 0 1 26 26A26 26 0 0 1 0 52Z"/>
    </rect>
    <ellipse cx="0" cy="-32" rx="11" ry="6.5" fill="#3a3a3a">
      <animateMotion dur="1s" begin="-0.5s" repeatCount="indefinite" path="M0 52A26 26 0 0 1-26 26A26 26 0 0 1 0 0A26 26 0 0 1 26 26A26 26 0 0 1 0 52Z"/>
    </ellipse>
  </g>

  <!-- bicycle frame -->
  <g fill="none" stroke="#262a31" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 365H366"/>
    <path d="M300 365L344 276"/>
    <path d="M366 365L346 262"/>
    <path d="M346 262L442 270" stroke-width="6"/>
    <path d="M366 365L450 298" stroke-width="6"/>
    <path d="M442 270L450 298" stroke-width="8"/>
    <path d="M450 298L470 365"/>
    <path d="M442 270L446 244" stroke-width="6"/>
    <path d="M446 244L468 230" stroke-width="5"/>
    <path d="M346 262L342 250" stroke-width="5"/>
  </g>
  <path d="M304 250Q326 240 352 244L350 256Q326 256 310 260Z" fill="#20242a"/>
  <path d="M300 355L366 349M300 375L366 381" fill="none" stroke="#2b2f36" stroke-width="2.2" stroke-dasharray="5 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-8" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- crank and chainring -->
  <g transform="translate(366 365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#3b4048" stroke-width="3"/>
      <path d="M0 26V-26" fill="none" stroke="#3b4048" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#6b7280"/>
  </g>

  <!-- near leg, pedal and shoe -->
  <path d="M334 244L373.8 313.4L366 391" fill="none" stroke="#1d1d1d" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="M334 244L373.8 313.4L366 391;M334 244L377.3 311.3L347.6 383.4;M334 244L387.7 303.3L340 365;M334 244L400.2 289L347.6 346.6;M334 244L408.4 273.5L366 339;M334 244L408.8 272.5L384.4 346.6;M334 244L401.1 287.5L392 365;M334 244L385.3 305.4L384.4 383.4;M334 244L373.8 313.4L366 391"/>
  </path>
  <g transform="translate(366 365)">
    <rect x="-9" y="24" width="18" height="4" rx="2" fill="#6b645a">
      <animateMotion dur="1s" repeatCount="indefinite" path="M0 0A26 26 0 0 1-26-26A26 26 0 0 1 0-52A26 26 0 0 1 26-26A26 26 0 0 1 0 0Z"/>
    </rect>
    <ellipse cx="0" cy="20" rx="11" ry="6.5" fill="#1d1d1d">
      <animateMotion dur="1s" repeatCount="indefinite" path="M0 0A26 26 0 0 1-26-26A26 26 0 0 1 0-52A26 26 0 0 1 26-26A26 26 0 0 1 0 0Z"/>
    </ellipse>
  </g>

  <!-- panda body -->
  <ellipse cx="356" cy="215" rx="40" ry="31" transform="rotate(-56 356 215)" fill="#1d1d1d"/>
  <ellipse cx="366" cy="222" rx="24" ry="17" transform="rotate(-56 366 222)" fill="#ffffff"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 370 180;6 370 180;-4 370 180" dur="0.6s" repeatCount="indefinite"/>
    <path d="M370 180Q344 168 318 178Q336 192 368 188Z" fill="#e4572e"/>
  </g>
  <path d="M368 176Q394 190 422 170L426 186Q394 202 364 184Z" fill="#e4572e"/>
  <path d="M384 188L410 206L456 236" fill="none" stroke="#1d1d1d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="456" cy="236" r="8" fill="#1d1d1d"/>

  <!-- panda head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.5s" repeatCount="indefinite"/>
    <circle cx="354" cy="103" r="15" fill="#1d1d1d"/>
    <circle cx="434" cy="103" r="15" fill="#1d1d1d"/>
    <ellipse cx="394" cy="134" rx="48" ry="42" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <g transform="translate(376 128) rotate(-15)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.9;0.93;0.96;1" dur="3.4s" repeatCount="indefinite"/>
        <ellipse rx="12" ry="15" fill="#1d1d1d"/>
        <circle cx="4" cy="-5" r="3.2" fill="#ffffff"/>
      </g>
    </g>
    <g transform="translate(412 128) rotate(15)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.9;0.93;0.96;1" dur="3.4s" repeatCount="indefinite"/>
        <ellipse rx="12" ry="15" fill="#1d1d1d"/>
        <circle cx="-4" cy="-5" r="3.2" fill="#ffffff"/>
      </g>
    </g>
    <ellipse cx="394" cy="150" rx="8" ry="5.5" fill="#1d1d1d"/>
    <path d="M387 161Q394 168 401 161" fill="none" stroke="#1d1d1d" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="365" cy="156" rx="7" ry="5" fill="#ff8fa3" opacity="0.6"/>
    <ellipse cx="423" cy="156" rx="7" ry="5" fill="#ff8fa3" opacity="0.6"/>
  </g>

  <!-- bamboo basket on the front -->
  <path d="M468 232L480 262" fill="none" stroke="#4a4f57" stroke-width="3" stroke-linecap="round"/>
  <path d="M476 262H508L503 294H481Z" fill="#dba35e" stroke="#9c6a2e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M478 272H506M481 283H503" fill="none" stroke="#9c6a2e" stroke-width="1.6"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 492 262;3 492 262;-3 492 262" dur="2.4s" repeatCount="indefinite"/>
    <rect x="482" y="212" width="6" height="52" rx="3" fill="#6cbc5c"/>
    <rect x="492" y="200" width="6" height="64" rx="3" fill="#58a84d"/>
    <rect x="501" y="216" width="5" height="48" rx="2.5" fill="#7fcd6e"/>
    <path d="M498 214Q510 204 522 210Q510 218 498 214Z" fill="#4f9d47"/>
    <path d="M501 226Q514 220 524 226Q512 232 501 226Z" fill="#4f9d47"/>
  </g>
</svg>
