<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">熊猫骑自行车动画</title>
  <desc id="desc">一只戴红围巾的熊猫骑着薄荷绿色自行车穿过春日公园，车轮、腿部、围巾、云朵和花瓣持续运动。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e4ff"/>
      <stop offset="0.7" stop-color="#e9faff"/>
      <stop offset="1" stop-color="#fff6df"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9edc73"/>
      <stop offset="1" stop-color="#4f9b5e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d5c8"/>
      <stop offset="1" stop-color="#a9aa9f"/>
    </linearGradient>
    <linearGradient id="bikePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fe0c0"/>
      <stop offset="1" stop-color="#087f86"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbd2"/>
      <stop offset="0.58" stop-color="#ffd45a"/>
      <stop offset="1" stop-color="#ffaf3f"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="sceneClip"><rect width="1200" height="800" rx="34"/></clipPath>

    <g id="cloud" fill="#fff" opacity="0.9">
      <ellipse cx="60" cy="38" rx="56" ry="24"/>
      <circle cx="47" cy="28" r="27"/>
      <circle cx="77" cy="20" r="34"/>
      <circle cx="107" cy="34" r="25"/>
    </g>
    <g id="petal">
      <path d="M0 0 C10 -10 22 -4 17 7 C13 15 5 16 0 0Z" fill="#ff91b8"/>
      <path d="M0 0 C-9 -11 -21 -6 -17 6 C-13 15 -5 16 0 0Z" fill="#ffd0de"/>
    </g>
    <g id="wheel">
      <circle r="112" fill="#f9fdff" fill-opacity="0.13" stroke="#26383c" stroke-width="14"/>
      <circle r="96" fill="none" stroke="#cbe9e8" stroke-width="3"/>
      <g stroke="#6a8588" stroke-width="3">
        <line x1="0" y1="0" x2="0" y2="-96"/><line x1="0" y1="0" x2="68" y2="-68"/>
        <line x1="0" y1="0" x2="96" y2="0"/><line x1="0" y1="0" x2="68" y2="68"/>
        <line x1="0" y1="0" x2="0" y2="96"/><line x1="0" y1="0" x2="-68" y2="68"/>
        <line x1="0" y1="0" x2="-96" y2="0"/><line x1="0" y1="0" x2="-68" y2="-68"/>
      </g>
      <g fill="#21bea8">
        <circle cy="-96" r="5"/><circle cx="68" cy="-68" r="5"/><circle cx="96" r="5"/>
        <circle cx="68" cy="68" r="5"/><circle cy="96" r="5"/><circle cx="-68" cy="68" r="5"/>
        <circle cx="-96" r="5"/><circle cx="-68" cy="-68" r="5"/>
      </g>
      <circle r="14" fill="#33474a" stroke="#e2f8f5" stroke-width="5"/>
    </g>
  </defs>

  <g clip-path="url(#sceneClip)">
    <rect width="1200" height="800" fill="url(#sky)"/>

    <!-- Sun -->
    <g transform="translate(1010 126)">
      <circle r="76" fill="#ffd85e" opacity="0.2" filter="url(#blur6)">
        <animate attributeName="r" values="72;88;72" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".18;.32;.18" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="48" fill="url(#sun)"/>
      <g stroke="#ffbe42" stroke-width="7" stroke-linecap="round" opacity="0.7">
        <line x1="0" y1="-67" x2="0" y2="-85"/><line x1="0" y1="67" x2="0" y2="85"/>
        <line x1="-67" y1="0" x2="-85" y2="0"/><line x1="67" y1="0" x2="85" y2="0"/>
        <line x1="-48" y1="-48" x2="-61" y2="-61"/><line x1="48" y1="48" x2="61" y2="61"/>
        <line x1="48" y1="-48" x2="61" y2="-61"/><line x1="-48" y1="48" x2="-61" y2="61"/>
      </g>
    </g>

    <!-- Drifting clouds -->
    <g transform="translate(-170 120)">
      <use href="#cloud"/>
      <animateTransform attributeName="transform" type="translate" values="-170 120;1240 120" dur="28s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(420 202) scale(.68)" opacity=".72">
      <use href="#cloud"/>
      <animateTransform attributeName="transform" type="translate" values="420 202;1280 202;-180 202;420 202" dur="38s" repeatCount="indefinite"/>
    </g>

    <!-- Distant hills -->
    <path d="M-80 505 Q150 315 350 495 Q535 310 735 490 Q940 300 1280 500 L1280 650 L-80 650Z" fill="#83c979"/>
    <path d="M-80 526 Q185 387 410 524 Q625 355 850 523 Q1030 402 1280 526 L1280 655 L-80 655Z" fill="#67b76d"/>
    <g fill="#e7f6da" opacity=".64">
      <path d="M292 469l56-70 49 66-40-26-18 17-16-15z"/>
      <path d="M684 455l52-72 59 79-44-29-19 15-19-14z"/>
    </g>

    <!-- Trees -->
    <g transform="translate(95 388)">
      <path d="M44 222 C38 141 51 73 81 3 C87 79 90 148 83 222Z" fill="#805c45"/>
      <path d="M62 121 Q21 71 5 34 M72 98 Q107 54 128 15 M56 75 Q32 37 29 3" fill="none" stroke="#805c45" stroke-width="16" stroke-linecap="round"/>
      <g fill="#ef7fa9">
        <circle cx="8" cy="30" r="39"/><circle cx="46" cy="15" r="46"/><circle cx="88" cy="31" r="45"/>
        <circle cx="125" cy="23" r="38"/><circle cx="25" cy="65" r="43"/><circle cx="72" cy="61" r="50"/>
        <circle cx="119" cy="63" r="42"/>
      </g>
      <g fill="#ffd1df" opacity=".85">
        <circle cx="20" cy="19" r="12"/><circle cx="61" cy="2" r="13"/><circle cx="101" cy="25" r="11"/>
        <circle cx="48" cy="62" r="12"/><circle cx="118" cy="57" r="10"/>
      </g>
    </g>
    <g transform="translate(1100 420) scale(.78)">
      <path d="M5 240 C25 152 20 77 -2 2 C43 74 60 157 52 240Z" fill="#795542"/>
      <path d="M19 111 Q-22 61 -46 24 M26 90 Q67 47 86 9" fill="none" stroke="#795542" stroke-width="18" stroke-linecap="round"/>
      <g fill="#ef87ac"><circle cx="-48" cy="22" r="44"/><circle cx="-5" cy="12" r="51"/><circle cx="43" cy="27" r="45"/><circle cx="83" cy="18" r="38"/><circle cx="25" cy="66" r="50"/></g>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#315e72" stroke-width="6" stroke-linecap="round" opacity=".65">
      <path d="M330 162 q17-18 34 0 q17-18 34 0"><animate attributeName="d" values="M330 162 q17-18 34 0 q17-18 34 0;M330 162 q17-8 34 0 q17-8 34 0;M330 162 q17-18 34 0 q17-18 34 0" dur="1.3s" repeatCount="indefinite"/></path>
      <path d="M440 105 q12-13 24 0 q12-13 24 0"><animate attributeName="d" values="M440 105 q12-13 24 0 q12-13 24 0;M440 105 q12-5 24 0 q12-5 24 0;M440 105 q12-13 24 0 q12-13 24 0" dur="1.1s" repeatCount="indefinite"/></path>
    </g>

    <!-- Ground and road -->
    <path d="M-20 560 C220 526 390 541 600 559 C830 580 1040 535 1220 554 L1220 805 L-20 805Z" fill="url(#grass)"/>
    <path d="M-30 654 C265 606 490 619 722 648 C915 671 1075 652 1230 619 L1230 805 L-30 805Z" fill="url(#road)"/>
    <path d="M-20 667 C255 621 486 630 718 659 C900 681 1070 669 1220 639" fill="none" stroke="#f7f2d6" stroke-width="7" stroke-dasharray="60 34" opacity=".85"/>
    <ellipse cx="630" cy="741" rx="343" ry="35" fill="#43585a" opacity=".2" filter="url(#blur6)"/>

    <!-- Grass streaks suggest motion -->
    <g stroke="#297f53" stroke-width="7" stroke-linecap="round" opacity=".58">
      <path d="M21 601h118"/><path d="M167 572h73"/><path d="M958 586h112"/><path d="M1084 616h76"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-80 0;0 0" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- Bicycle and panda -->
    <g id="rider" filter="url(#softShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>

      <!-- Wheels -->
      <g transform="translate(410 645)">
        <g>
          <use href="#wheel"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        </g>
      </g>
      <g transform="translate(820 645)">
        <g>
          <use href="#wheel"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- Bicycle frame -->
      <g fill="none" stroke="url(#bikePaint)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
        <path d="M410 645 L510 468 L650 645 L410 645 L585 645 L740 483 L820 645"/>
        <path d="M650 645 L618 478"/>
      </g>
      <g fill="none" stroke="#244a4d" stroke-width="10" stroke-linecap="round">
        <path d="M740 483 L718 439 L773 439"/>
        <path d="M510 468 L481 451"/>
      </g>
      <rect x="455" y="439" width="77" height="17" rx="9" fill="#293c3f"/>

      <!-- Rear rack and bamboo cargo -->
      <path d="M355 499 H454 L410 645 M355 499 L332 610" fill="none" stroke="#486669" stroke-width="9" stroke-linejoin="round"/>
      <g transform="rotate(-8 378 473)">
        <rect x="335" y="430" width="95" height="78" rx="10" fill="#a76736" stroke="#71401f" stroke-width="5"/>
        <path d="M346 431v76m21-76v76m22-76v76m21-76v76" stroke="#d1965b" stroke-width="4"/>
        <g stroke="#41975a" stroke-width="12" stroke-linecap="round">
          <path d="M351 434l-10-83"/><path d="M376 432l11-105"/><path d="M403 436l27-92"/>
        </g>
        <g fill="#65b968">
          <path d="M339 370q-28-21-38 2q20 18 38-2"/><path d="M386 348q-29-23-38 1q19 18 38-1"/>
          <path d="M423 365q26-24 38-2q-17 21-38 2"/><path d="M350 395q25-24 37-2q-17 21-37 2"/>
        </g>
      </g>

      <!-- Panda body -->
      <g id="pandaBody">
        <path d="M511 477 C482 408 503 338 564 314 C635 286 701 324 719 392 C735 450 704 508 653 528 C592 550 535 524 511 477Z" fill="#fffdf5" stroke="#27383b" stroke-width="8"/>
        <path d="M520 461 C491 451 478 474 494 493 C513 515 546 503 551 478Z" fill="#263538"/>
        <path d="M685 421 C718 408 729 435 712 455 C696 473 675 461 670 441Z" fill="#263538"/>

        <!-- Head and ears -->
        <g>
          <circle cx="575" cy="299" r="49" fill="#253437"/>
          <circle cx="682" cy="295" r="49" fill="#253437"/>
          <path d="M555 368 C540 298 573 247 637 238 C704 229 750 274 744 345 C739 407 698 433 634 427 C585 423 565 402 555 368Z" fill="#fffdf5" stroke="#27383b" stroke-width="8"/>

          <!-- Eye patches -->
          <g fill="#263538">
            <ellipse cx="604" cy="329" rx="29" ry="39" transform="rotate(28 604 329)"/>
            <ellipse cx="693" cy="322" rx="29" ry="39" transform="rotate(-24 693 322)"/>
          </g>
          <g fill="#f8ffff">
            <ellipse cx="610" cy="329" rx="9" ry="13">
              <animate attributeName="ry" values="13;13;1.5;13;13" keyTimes="0;.43;.47;.51;1" dur="4.2s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="687" cy="324" rx="9" ry="13">
              <animate attributeName="ry" values="13;13;1.5;13;13" keyTimes="0;.43;.47;.51;1" dur="4.2s" repeatCount="indefinite"/>
            </ellipse>
          </g>
          <g fill="#27383b"><circle cx="613" cy="332" r="5"/><circle cx="684" cy="327" r="5"/></g>
          <path d="M636 360 Q650 348 664 360 Q652 374 636 360Z" fill="#263538"/>
          <path d="M650 371 Q650 385 636 389 M650 385 Q661 394 673 386" fill="none" stroke="#263538" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="590" cy="375" rx="18" ry="9" fill="#ff9fac" opacity=".65"/>
          <ellipse cx="708" cy="370" rx="18" ry="9" fill="#ff9fac" opacity=".65"/>
        </g>

        <!-- Scarf -->
        <path d="M561 403 Q645 438 723 394 L716 432 Q640 466 567 435Z" fill="#e53d46" stroke="#9e2730" stroke-width="5"/>
        <g>
          <path d="M697 422 C754 416 797 433 837 455 C798 462 765 457 720 448Z" fill="#e53d46" stroke="#9e2730" stroke-width="5"/>
          <path d="M721 444 C769 456 795 482 817 512 C777 498 746 481 708 459Z" fill="#f1585f" stroke="#9e2730" stroke-width="5"/>
          <animateTransform attributeName="transform" type="rotate" values="-3 705 431;6 705 431;-3 705 431" dur="1.2s" repeatCount="indefinite"/>
        </g>

        <!-- Arms to handlebar -->
        <g fill="none" stroke="#263538" stroke-width="28" stroke-linecap="round">
          <path d="M686 441 Q720 456 748 451"/>
          <path d="M544 442 Q564 467 585 480"/>
        </g>
        <g fill="#263538"><circle cx="750" cy="449" r="17"/><circle cx="586" cy="481" r="17"/></g>
      </g>

      <!-- Animated legs -->
      <g fill="none" stroke="#263538" stroke-width="31" stroke-linecap="round" stroke-linejoin="round">
        <path d="M567 492 Q594 532 620 566 Q648 592 653 632">
          <animate attributeName="d" values="M567 492 Q594 532 620 566 Q648 592 653 632;M567 492 Q604 531 638 548 Q674 563 690 597;M567 492 Q609 520 650 526 Q692 531 710 554;M567 492 Q594 532 620 566 Q648 592 653 632;M567 492 Q577 538 566 576 Q555 610 526 629;M567 492 Q567 534 547 558 Q520 581 500 601;M567 492 Q577 538 566 576 Q555 610 526 629;M567 492 Q594 532 620 566 Q648 592 653 632" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M644 500 Q614 536 589 572 Q563 598 559 633">
          <animate attributeName="d" values="M644 500 Q614 536 589 572 Q563 598 559 633;M644 500 Q617 540 578 550 Q544 562 525 594;M644 500 Q608 528 566 532 Q527 538 506 560;M644 500 Q614 536 589 572 Q563 598 559 633;M644 500 Q655 536 668 572 Q680 608 706 627;M644 500 Q657 534 680 557 Q706 580 727 599;M644 500 Q655 536 668 572 Q680 608 706 627;M644 500 Q614 536 589 572 Q563 598 559 633" dur="1.6s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Crank and pedals -->
      <g transform="translate(620 645)">
        <g>
          <circle r="29" fill="#f7e36d" stroke="#29494c" stroke-width="8"/>
          <g stroke="#29494c" stroke-width="9" stroke-linecap="round">
            <line x1="0" y1="0" x2="47" y2="0"/><line x1="0" y1="0" x2="-47" y2="0"/>
            <line x1="41" y1="0" x2="56" y2="0"/><line x1="-41" y1="0" x2="-56" y2="0"/>
          </g>
          <circle r="8" fill="#29494c"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- Foreground flowers -->
    <g>
      <g transform="translate(70 671)"><path d="M0 43V4" stroke="#2f8b52" stroke-width="5"/><circle r="13" fill="#fff"/><circle r="5" fill="#ffc845"/></g>
      <g transform="translate(1040 608)"><path d="M0 45V4" stroke="#2f8b52" stroke-width="5"/><circle r="15" fill="#ff8aad"/><circle r="5" fill="#ffd85a"/></g>
      <g transform="translate(1133 632)"><path d="M0 39V2" stroke="#2f8b52" stroke-width="5"/><circle r="11" fill="#fff"/><circle r="4" fill="#ffc845"/></g>
    </g>

    <!-- Falling petals -->
    <g opacity=".9">
      <g transform="translate(148 -25)"><use href="#petal"/><animateTransform attributeName="transform" type="translate" values="148 -25;215 830" dur="7.5s" repeatCount="indefinite"/></g>
      <g transform="translate(270 -35) rotate(30)"><use href="#petal" transform="scale(.7)"/><animateTransform attributeName="transform" type="translate" values="270 -35;190 830" dur="9s" begin="-3s" repeatCount="indefinite"/></g>
      <g transform="translate(965 -15) rotate(-25)"><use href="#petal" transform="scale(.75)"/><animateTransform attributeName="transform" type="translate" values="965 -15;1080 830" dur="8.2s" begin="-5s" repeatCount="indefinite"/></g>
      <g transform="translate(1110 -30)"><use href="#petal" transform="scale(.55)"/><animateTransform attributeName="transform" type="translate" values="1110 -30;1000 830" dur="9.6s" begin="-2s" repeatCount="indefinite"/></g>
      <g transform="translate(55 -20) rotate(70)"><use href="#petal" transform="scale(.6)"/><animateTransform attributeName="transform" type="translate" values="55 -20;130 830" dur="8.7s" begin="-6s" repeatCount="indefinite"/></g>
    </g>

    <!-- Butterfly -->
    <g transform="translate(900 375)">
      <g fill="#7866d8" stroke="#5144a9" stroke-width="3">
        <ellipse cx="-12" cy="-8" rx="18" ry="26" transform="rotate(-30 -12 -8)">
          <animate attributeName="rx" values="18;5;18" dur=".55s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="12" cy="-8" rx="18" ry="26" transform="rotate(30 12 -8)">
          <animate attributeName="rx" values="18;5;18" dur=".55s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="4" rx="5" ry="15" fill="#3c365f"/>
      </g>
      <animateTransform attributeName="transform" type="translate" values="900 375;940 350;980 382;900 375" dur="4.5s" repeatCount="indefinite"/>
    </g>

    <!-- Label -->
    <g transform="translate(52 54)" opacity=".92">
      <rect width="250" height="65" rx="32" fill="#173d46"/>
      <circle cx="34" cy="32.5" r="17" fill="#fff"/>
      <circle cx="27" cy="25" r="7" fill="#173d46"/><circle cx="41" cy="25" r="7" fill="#173d46"/>
      <circle cx="28" cy="34" r="5" fill="#173d46"/><circle cx="40" cy="34" r="5" fill="#173d46"/>
      <text x="63" y="41" fill="#fff" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="24" font-weight="700" letter-spacing="1">春日骑行</text>
    </g>
  </g>
  <rect x="3" y="3" width="1194" height="794" rx="31" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="6"/>
</svg>
