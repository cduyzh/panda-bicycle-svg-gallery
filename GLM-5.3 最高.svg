<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>熊猫骑自行车 · GLM-5.3</title>
  <desc>一只戴红围巾的熊猫骑着自行车，车轮旋转、双腿蹬踏、路面飞驰。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5dcff"/>
      <stop offset="1" stop-color="#eafaff"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 太阳与旋转光芒 -->
  <g transform="translate(690,95)">
    <g stroke="#ffd93b" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <line x1="0" y1="-42" x2="0" y2="-56"/>
      <line x1="0" y1="-42" x2="0" y2="-56" transform="rotate(45)"/>
      <line x1="0" y1="-42" x2="0" y2="-56" transform="rotate(90)"/>
      <line x1="0" y1="-42" x2="0" y2="-56" transform="rotate(135)"/>
      <line x1="0" y1="-42" x2="0" y2="-56" transform="rotate(180)"/>
      <line x1="0" y1="-42" x2="0" y2="-56" transform="rotate(225)"/>
      <line x1="0" y1="-42" x2="0" y2="-56" transform="rotate(270)"/>
      <line x1="0" y1="-42" x2="0" y2="-56" transform="rotate(315)"/>
    </g>
    <circle r="32" fill="#ffcf3f"/>
    <circle r="24" fill="#ffe066"/>
  </g>

  <!-- 云朵飘过 -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <animateTransform attributeName="transform" type="translate" values="900,60; -320,60" dur="46s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="46" ry="18"/>
      <ellipse cx="34" cy="7" rx="34" ry="13"/>
      <ellipse cx="-34" cy="8" rx="28" ry="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="900,135; -320,135" dur="64s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="36" ry="14"/>
      <ellipse cx="28" cy="6" rx="26" ry="10"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="900,35; -320,35" dur="78s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="26" ry="10"/>
      <ellipse cx="20" cy="5" rx="18" ry="8"/>
    </g>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#556575" stroke-width="2.5" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="860,150; -80,115" dur="28s" repeatCount="indefinite"/>
    <path d="M0,0 Q7,-8 14,-1 Q21,-8 28,0"/>
    <path d="M46,-14 Q52,-21 58,-15 Q64,-21 70,-14" transform="scale(0.85)"/>
  </g>

  <!-- 远山 -->
  <ellipse cx="150" cy="545" rx="330" ry="95" fill="#b9e28c"/>
  <ellipse cx="620" cy="555" rx="390" ry="110" fill="#a5d977"/>

  <!-- 左侧竹丛（摇曳） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.6 75 505; 1.6 75 505; -1.6 75 505" dur="3.6s" repeatCount="indefinite"/>
    <rect x="66" y="300" width="13" height="208" rx="6" fill="#5aa85f"/>
    <path d="M66,340 h13 M66,380 h13 M66,420 h13 M66,460 h13" stroke="#3e7d44" stroke-width="2.5"/>
    <ellipse cx="58" cy="292" rx="16" ry="6" fill="#4caf50" transform="rotate(-35 58 292)"/>
    <ellipse cx="88" cy="296" rx="16" ry="6" fill="#43a047" transform="rotate(30 88 296)"/>
    <ellipse cx="72" cy="282" rx="7" ry="16" fill="#4caf50"/>
    <rect x="88" y="360" width="10" height="148" rx="5" fill="#6bb86e"/>
    <path d="M88,392 h10 M88,424 h10 M88,456 h10" stroke="#3e7d44" stroke-width="2"/>
    <ellipse cx="96" cy="352" rx="13" ry="5" fill="#43a047" transform="rotate(28 96 352)"/>
  </g>

  <!-- 右侧竹丛（摇曳） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="1.4 735 505; -1.4 735 505; 1.4 735 505" dur="4.4s" repeatCount="indefinite"/>
    <rect x="724" y="300" width="13" height="208" rx="6" fill="#5aa85f"/>
    <path d="M724,340 h13 M724,380 h13 M724,420 h13 M724,460 h13" stroke="#3e7d44" stroke-width="2.5"/>
    <ellipse cx="746" cy="292" rx="16" ry="6" fill="#4caf50" transform="rotate(35 746 292)"/>
    <ellipse cx="716" cy="296" rx="16" ry="6" fill="#43a047" transform="rotate(-30 716 296)"/>
    <ellipse cx="732" cy="282" rx="7" ry="16" fill="#4caf50"/>
    <rect x="706" y="360" width="10" height="148" rx="5" fill="#6bb86e"/>
    <path d="M706,392 h10 M706,424 h10 M706,456 h10" stroke="#3e7d44" stroke-width="2"/>
    <ellipse cx="712" cy="352" rx="13" ry="5" fill="#43a047" transform="rotate(-28 712 352)"/>
  </g>

  <!-- 公路与草地 -->
  <rect x="0" y="508" width="800" height="36" fill="#64748b"/>
  <rect x="0" y="508" width="800" height="4" fill="#536179"/>
  <rect x="0" y="544" width="800" height="56" fill="#7ec850"/>
  <rect x="0" y="544" width="800" height="5" fill="#6ab33e"/>

  <!-- 路面虚线向后飞驰 -->
  <path d="M0,526 H800" stroke="#f1f5f9" stroke-width="5" stroke-dasharray="26 22">
    <animate attributeName="stroke-dashoffset" values="0;96" dur="0.24s" repeatCount="indefinite"/>
  </path>

  <!-- 草丛与小花向后滚动（无缝循环） -->
  <g stroke="#3e8e41" stroke-width="3" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="translate" values="0,0; -160,0" dur="0.4s" repeatCount="indefinite"/>
    <path d="M-8,553 l3,-12 M-2,553 l0,-14 M3,553 l4,-11"/>
    <circle cx="30" cy="548" r="3.5" fill="#ff8fa3" stroke="none"/>
    <circle cx="68" cy="551" r="3" fill="#ffd166" stroke="none"/>
    <path d="M152,553 l3,-12 M158,553 l0,-14 M163,553 l4,-11"/>
    <circle cx="190" cy="548" r="3.5" fill="#ffd166" stroke="none"/>
    <circle cx="228" cy="551" r="3" fill="#ff8fa3" stroke="none"/>
    <path d="M312,553 l3,-12 M318,553 l0,-14 M323,553 l4,-11"/>
    <circle cx="350" cy="548" r="3.5" fill="#ff8fa3" stroke="none"/>
    <circle cx="388" cy="551" r="3" fill="#ffd166" stroke="none"/>
    <path d="M472,553 l3,-12 M478,553 l0,-14 M483,553 l4,-11"/>
    <circle cx="510" cy="548" r="3.5" fill="#ffd166" stroke="none"/>
    <circle cx="548" cy="551" r="3" fill="#ff8fa3" stroke="none"/>
    <path d="M632,553 l3,-12 M638,553 l0,-14 M643,553 l4,-11"/>
    <circle cx="670" cy="548" r="3.5" fill="#ff8fa3" stroke="none"/>
    <circle cx="708" cy="551" r="3" fill="#ffd166" stroke="none"/>
    <path d="M792,553 l3,-12 M798,553 l0,-14 M803,553 l4,-11"/>
    <circle cx="830" cy="548" r="3.5" fill="#ffd166" stroke="none"/>
    <circle cx="868" cy="551" r="3" fill="#ff8fa3" stroke="none"/>
    <path d="M952,553 l3,-12 M958,553 l0,-14 M963,553 l4,-11"/>
    <circle cx="990" cy="548" r="3.5" fill="#ff8fa3" stroke="none"/>
    <circle cx="1028" cy="551" r="3" fill="#ffd166" stroke="none"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.25;1" dur="0.55s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="60,0; -70,0" dur="0.55s" repeatCount="indefinite"/>
      <line x1="95" y1="245" x2="175" y2="245"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.25;1" dur="0.55s" begin="-0.18s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="60,0; -70,0" dur="0.55s" begin="-0.18s" repeatCount="indefinite"/>
      <line x1="110" y1="290" x2="180" y2="290"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.25;1" dur="0.55s" begin="-0.36s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="60,0; -70,0" dur="0.55s" begin="-0.36s" repeatCount="indefinite"/>
      <line x1="90" y1="335" x2="165" y2="335"/>
    </g>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="513" rx="185" ry="9" fill="#1f2937" opacity="0.15"/>

  <!-- ===== 骑手整体（轻微颠簸） ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="0.8s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>

    <!-- 后轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 280 440" to="360 280 440" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="280" cy="440" r="66" fill="none" stroke="#333333" stroke-width="9"/>
      <circle cx="280" cy="440" r="57" fill="none" stroke="#d8d8d8" stroke-width="3"/>
      <path d="M225,440 H335 M241.1,401.1 L318.9,478.9 M280,385 V495 M241.1,478.9 L318.9,401.1" stroke="#bdbdbd" stroke-width="2.5"/>
      <circle cx="280" cy="400" r="3.5" fill="#555555"/>
      <circle cx="280" cy="440" r="7" fill="#666666"/>
    </g>

    <!-- 前轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 520 440" to="360 520 440" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="520" cy="440" r="66" fill="none" stroke="#333333" stroke-width="9"/>
      <circle cx="520" cy="440" r="57" fill="none" stroke="#d8d8d8" stroke-width="3"/>
      <path d="M465,440 H575 M481.1,401.1 L558.9,478.9 M520,385 V495 M481.1,478.9 L558.9,401.1" stroke="#bdbdbd" stroke-width="2.5"/>
      <circle cx="520" cy="400" r="3.5" fill="#555555"/>
      <circle cx="520" cy="440" r="7" fill="#666666"/>
    </g>

    <!-- 远侧脚踏板 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="360,440; 370.3,415.3; 395,405; 419.7,415.3; 430,440; 419.7,464.7; 395,475; 370.3,464.7; 360,440"
        dur="1.6s" repeatCount="indefinite"/>
      <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#4a4a4a"/>
    </g>

    <!-- 远侧腿（蹬踏，路径变形） -->
    <path fill="none" stroke="#3f3f3f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" d="M335,310 L414.4,362.1 L360,440 L373,443">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
        M335,310 L414.4,362.1 L360,440 L373,443;
        M335,310 L425.7,338.2 L370.3,415.3 L383.3,418.3;
        M335,310 L429.7,316.6 L395,405 L408,408;
        M335,310 L429.4,320.8 L419.7,415.3 L432.7,418.3;
        M335,310 L404.5,358.9 L430,440 L443,443;
        M335,310 L408.3,370.4 L419.7,464.7 L432.7,467.7;
        M335,310 L399.1,380.1 L395,475 L408,478;
        M335,310 L403.7,375.7 L370.3,464.7 L383.3,467.7;
        M335,310 L414.4,362.1 L360,440 L373,443"/>
    </path>

    <!-- 链条 -->
    <g stroke="#3f3f3f" stroke-width="3.5" stroke-dasharray="6 5">
      <line x1="283" y1="427" x2="393" y2="427">
        <animate attributeName="stroke-dashoffset" values="0;33" dur="0.18s" repeatCount="indefinite"/>
      </line>
      <line x1="283" y1="453" x2="393" y2="453">
        <animate attributeName="stroke-dashoffset" values="0;33" dur="0.18s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- 牙盘与曲柄 -->
    <circle cx="395" cy="440" r="15" fill="#d9d9d9" stroke="#4a4a4a" stroke-width="4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 395 440" to="360 395 440" dur="1.6s" repeatCount="indefinite"/>
      <path d="M360,440 L430,440" stroke="#3a3a3a" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e04b3a" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M280,440 L395,440"/>
      <path d="M280,440 L337,336"/>
      <path d="M395,440 L338,332"/>
      <path d="M338,332 L492,342"/>
      <path d="M395,440 L490,356"/>
      <path d="M486,332 L496,366" stroke-width="10"/>
    </g>
    <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M490,362 L520,440"/>
      <path d="M490,336 L505,306"/>
      <path d="M505,306 Q520,296 534,304"/>
    </g>

    <!-- 车筐与竹子 -->
    <g>
      <rect x="525" y="262" width="6" height="44" rx="3" fill="#6fbf73"/>
      <path d="M525,274 h6 M525,288 h6 M525,302 h6" stroke="#4e9e54" stroke-width="1.8"/>
      <ellipse cx="517" cy="258" rx="12" ry="5" fill="#4caf50" transform="rotate(-32 517 258)"/>
      <ellipse cx="539" cy="256" rx="12" ry="5" fill="#43a047" transform="rotate(26 539 256)"/>
      <path d="M506,306 L546,306 L541,332 L512,332 Z" fill="#c68b4a" stroke="#8a5a28" stroke-width="2"/>
      <path d="M510,314 L543,314 M511,323 L542,323 M528,306 V332" stroke="#8a5a28" stroke-width="1.5" fill="none"/>
    </g>

    <!-- 车座 -->
    <path d="M312,326 Q332,316 352,324" stroke="#5a3a24" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- 车牌 -->
    <g transform="rotate(-12 293,339)">
      <rect x="264" y="330" width="58" height="18" rx="4" fill="#ffffff" stroke="#e04b3a" stroke-width="2.5"/>
      <text x="293" y="344" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#e04b3a" text-anchor="middle">GLM-5.3</text>
    </g>

    <!-- 近侧脚踏板 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="430,440; 419.7,464.7; 395,475; 370.3,464.7; 360,440; 370.3,415.3; 395,405; 419.7,415.3; 430,440"
        dur="1.6s" repeatCount="indefinite"/>
      <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#262626"/>
    </g>

    <!-- 近侧腿（蹬踏，路径变形） -->
    <path fill="none" stroke="#1f1f1f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M335,310 L404.5,358.9 L430,440 L443,443">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
        M335,310 L404.5,358.9 L430,440 L443,443;
        M335,310 L408.3,370.4 L419.7,464.7 L432.7,467.7;
        M335,310 L399.1,380.1 L395,475 L408,478;
        M335,310 L403.7,375.7 L370.3,464.7 L383.3,467.7;
        M335,310 L414.4,362.1 L360,440 L373,443;
        M335,310 L425.7,338.2 L370.3,415.3 L383.3,418.3;
        M335,310 L429.7,316.6 L395,405 L408,408;
        M335,310 L429.4,320.8 L419.7,415.3 L432.7,418.3;
        M335,310 L404.5,358.9 L430,440 L443,443"/>
    </path>

    <!-- 围巾飘带 -->
    <path fill="#e63946" d="M392,226 Q352,212 318,224 Q340,238 324,250 Q352,244 368,234 Z">
      <animate attributeName="d" dur="0.45s" repeatCount="indefinite" values="
        M392,226 Q352,212 318,224 Q340,238 324,250 Q352,244 368,234 Z;
        M392,226 Q350,224 316,218 Q338,240 328,254 Q354,240 372,234 Z;
        M392,226 Q352,212 318,224 Q340,238 324,250 Q352,244 368,234 Z"/>
    </path>

    <!-- 远侧手臂 -->
    <path d="M370,244 Q440,270 498,306" stroke="#3a3a3a" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="498" cy="306" r="8.5" fill="#3a3a3a"/>

    <!-- 身体 -->
    <ellipse cx="348" cy="258" rx="46" ry="56" fill="#ffffff" stroke="#1f1f1f" stroke-width="3" transform="rotate(14 348 258)"/>

    <!-- 近侧手臂 -->
    <path d="M382,238 Q450,258 512,300" stroke="#1f1f1f" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="512" cy="300" r="9" fill="#1f1f1f"/>

    <!-- 围巾圈 -->
    <ellipse cx="404" cy="219" rx="15" ry="8" fill="#e63946" transform="rotate(18 404 219)"/>

    <!-- 头部（轻微起伏 + 眨眼） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,2.5; 0,0" dur="0.8s" repeatCount="indefinite"/>
      <circle cx="391" cy="146" r="17" fill="#1f1f1f"/>
      <circle cx="451" cy="146" r="17" fill="#1f1f1f"/>
      <circle cx="421" cy="182" r="45" fill="#ffffff" stroke="#1f1f1f" stroke-width="3"/>
      <ellipse cx="403" cy="178" rx="13" ry="17" fill="#1f1f1f" transform="rotate(-18 403 178)"/>
      <ellipse cx="440" cy="178" rx="13" ry="17" fill="#1f1f1f" transform="rotate(18 440 178)"/>
      <ellipse cx="404" cy="180" rx="4.6" ry="4.6" fill="#ffffff">
        <animate attributeName="ry" values="4.6;4.6;0.5;4.6;4.6" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="441" cy="180" rx="4.6" ry="4.6" fill="#ffffff">
        <animate attributeName="ry" values="4.6;4.6;0.5;4.6;4.6" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="405" cy="181" r="2.4" fill="#1f1f1f">
        <animate attributeName="r" values="2.4;2.4;0.2;2.4;2.4" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="442" cy="181" r="2.4" fill="#1f1f1f">
        <animate attributeName="r" values="2.4;2.4;0.2;2.4;2.4" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="406" cy="179.6" r="0.9" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="443" cy="179.6" r="0.9" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="422" cy="199" rx="5.5" ry="4" fill="#1f1f1f"/>
      <path d="M413,209 Q422,216 431,209" stroke="#1f1f1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="392" cy="200" rx="6" ry="3.5" fill="#ffb3ba" opacity="0.7"/>
      <ellipse cx="452" cy="200" rx="6" ry="3.5" fill="#ffb3ba" opacity="0.7"/>
    </g>

    <!-- 围巾结 -->
    <circle cx="398" cy="228" r="7" fill="#e63946"/>
  </g>
</svg>
